          sleep 2
          ./dansal_web --config /etc/dansal/e2e/web.yaml > /tmp/dansal_web.log 2>&1 &
          sleep 2

      - name: Run accessibility sweep
        run: |
          cd e2e
          npx playwright test --project=${{ matrix.project }} tests/accessibility/
        env:
          BASE_URL: http://localhost:18080
