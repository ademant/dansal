name: E2E Tests

# Two tiers (#1555 follow-up):
#   smoke — the @smoke-tagged journeys, desktop only, on every PR and push to
#           main. Fast enough to gate a merge.
#   full  — every journey on desktop and mobile, plus the WCAG sweep. Runs on
#           release tags (called from release.yml, which waits for it before
#           packaging), nightly, and on manual dispatch.
on:
  workflow_call:
    inputs:
      suite:
        description: "smoke or full"
        type: string
        default: full
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke or full"
        type: choice
        options: [full, smoke]
        default: full
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Picks the suite for this run. Pushes and PRs get smoke; schedule, manual
  # runs and release calls get full, unless the caller passes suite explicitly.
  plan:
    name: Select suite
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.pick.outputs.suite }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          SUITE: ${{ inputs.suite || ((github.event_name == 'push' || github.event_name == 'pull_request') && 'smoke' || 'full') }}
        run: |
          if [ "$SUITE" = smoke ]; then
            echo 'suite=smoke' >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"project":"desktop","grep":"@smoke"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'suite=full' >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"project":"desktop","grep":""},{"project":"mobile","grep":""}]' >> "$GITHUB_OUTPUT"
          fi

  e2e-journeys:
    name: Playwright Journeys (${{ matrix.project }}${{ matrix.grep && ', smoke' || '' }})
    needs: plan
    runs-on: ubuntu-latest
    # 20 min was never actually validated against a real run — every prior
    # CI run failed within 1-2 min at setup (#1522 etc.), so this cap never
    # mattered until the suite could run far enough to hit it (#1531): ~100
    # of ~37 spec files' tests still weren't done at 20 min.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build binaries
        run: make build

      - name: Install e2e dependencies
        run: make e2e-install

      - name: Start services
        run: |
          sudo mkdir -p /var/lib/dansal/e2e /var/lib/dansal-web/e2e /etc/dansal/e2e
          # packaging/config.yaml's db_path/images_dir/admin_socket/backup_dir
          # (and web.yaml's db_path/images_dir) all point directly under
          # /var/lib/dansal(-web), not the .../e2e leaf just created above —
          # same root-owned-parent issue as #1522's sed fix, one level up:
          # the unprivileged dansal/dansal_web processes below need to create
          # their socket/DB/images there themselves (#1526).
          sudo chown -R "$(id -u):$(id -g)" /var/lib/dansal /var/lib/dansal-web
          sudo cp packaging/config.yaml /etc/dansal/e2e/config.yaml
          sudo cp packaging/web.yaml /etc/dansal/e2e/web.yaml
          sudo cp packaging/webmin.yaml /etc/dansal/e2e/webmin.yaml
          # These configs were just copied in with `sudo cp`, so they (and the
          # /etc/dansal/e2e dir sed -i needs to write its temp file into) are
          # root-owned — every in-place edit below needs sudo too, or sed
          # fails with "Permission denied" creating that temp file (#1522).
          sudo sed -i 's/port: 8000/port: 18000/' /etc/dansal/e2e/config.yaml
          # Server.Listen (set explicitly below) takes precedence over
          # Server.Port for the actual bind address — Port only defaults
          # Listen when Listen is empty (cmd/dansal/config.go) — so the
          # port: sed above never affected what dansal actually binds to.
          # Without this, dansal always listened on :8000, not :18000 (#1529).
          sudo sed -i 's/listen: "127.0.0.1:8000"/listen: "127.0.0.1:18000"/' /etc/dansal/e2e/config.yaml
          grep -q 'listen: "127.0.0.1:18000"' /etc/dansal/e2e/config.yaml
          # The suite drives the API directly on loopback (no shared-secret
          # exemption), so every spec's seed calls share one per-IP bucket;
          # the packaging default of 100/min is exhausted mid-run (#1345).
          sudo sed -i 's/^  rate_limit: 100$/  rate_limit: 1000/' /etc/dansal/e2e/config.yaml
          grep -q '^  rate_limit: 1000$' /etc/dansal/e2e/config.yaml
          # Seeding alone exceeds the default 30 creates/updates per minute
          # per account (#1423) — same value the dev e2e target uses.
          sudo sed -i 's/^  account_mutation_rate_limit: 0$/  account_mutation_rate_limit: 600/' /etc/dansal/e2e/config.yaml
          grep -q '^  account_mutation_rate_limit: 600$' /etc/dansal/e2e/config.yaml
          # packaging/web.yaml's actual format is `listen: "127.0.0.1:8080"`
          # (quoted, with a host) — the old bare `listen: :8080` pattern
          # never matched it, so this sed silently no-op'ed and dansal_web
          # always bound to the untouched default port instead of :18080,
          # while every spec points BASE_URL at :18080 (#1528). grep -q
          # verifies the match the same way the rate_limit sed above already
          # does, so a future packaging format change fails loudly instead
          # of silently drifting out of sync again.
          sudo sed -i 's/listen: "127.0.0.1:8080"/listen: "127.0.0.1:18080"/' /etc/dansal/e2e/web.yaml
          grep -q 'listen: "127.0.0.1:18080"' /etc/dansal/e2e/web.yaml
          sudo sed -i 's/listen: "127.0.0.1:8090"/listen: "127.0.0.1:18090"/' /etc/dansal/e2e/webmin.yaml
          grep -q 'listen: "127.0.0.1:18090"' /etc/dansal/e2e/webmin.yaml
          # web.yaml's dansal_url is a separate field from its own listen:
          # above — it's where dansal_web reaches the *API* (dansal, not
          # itself), which now binds :18000 per the config.yaml listen fix
          # above. Without this, dansal_web can't verify a magic-login
          # token (calls the API internally), so global-setup's login never
          # reaches /dashboard and just times out after 30s (#1530).
          sudo sed -i 's|dansal_url: "http://127.0.0.1:8000"|dansal_url: "http://127.0.0.1:18000"|' /etc/dansal/e2e/web.yaml
          grep -q 'dansal_url: "http://127.0.0.1:18000"' /etc/dansal/e2e/web.yaml
          # Same dansal_url fix as web.yaml above, for webmin's own calls to
          # the API (admin-session revalidation, GET /api/v1/me) — #1537's
          # webmin CSRF e2e coverage needs dansal_webmin actually reachable.
          # admin_socket/web_db_path are left untouched: both already match
          # packaging's defaults verbatim (/var/lib/dansal/dansal.sock,
          # /var/lib/dansal-web/web.db — the same paths config.yaml/web.yaml
          # resolve to unsed, per the comment atop this step), so dansal_web's
          # already-chowned/created web.db and dansal's already-created
          # socket are exactly what webmin needs, no further sed required.
          sudo sed -i 's|dansal_url: "http://127.0.0.1:8000"|dansal_url: "http://127.0.0.1:18000"|' /etc/dansal/e2e/webmin.yaml
          grep -q 'dansal_url: "http://127.0.0.1:18000"' /etc/dansal/e2e/webmin.yaml
          # Redirected (rather than left on the step's own stdout) because a
          # background `&` process's output isn't captured once this step's
          # synchronous commands finish — a startup failure here otherwise
          # surfaces only indirectly, several steps later, as a Playwright
          # connection-refused error with no indication of why.
          ./dansal --config /etc/dansal/e2e/config.yaml > /tmp/dansal.log 2>&1 &
          sleep 2
          ./dansal_web --config /etc/dansal/e2e/web.yaml > /tmp/dansal_web.log 2>&1 &
          sleep 2
          ./dansal_webmin --config /etc/dansal/e2e/webmin.yaml > /tmp/dansal_webmin.log 2>&1 &
          sleep 2

      - name: Run journey tests
        run: |
          cd e2e
          npx playwright test --project=${{ matrix.project }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }} tests/journeys/
        env:
          BASE_URL: http://localhost:18080
          API_URL: http://localhost:18000
          WEBMIN_URL: http://localhost:18090
          ADMIN_SOCKET: /var/lib/dansal/dansal.sock
          ADMIN_NO_SUDO: "1"
          # Without this, helpers/seed.ts's ADMIN_CLI defaults to the bare
          # name "dansal_admin", which isn't on PATH — the built binary sits
          # at the repo root ($GITHUB_WORKSPACE), not e2e/ (#1524).
          ADMIN_CLI: ${{ github.workspace }}/dansal_admin
          WEB_DB_PATH: /var/lib/dansal-web/web.db

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== dansal.log ==="; cat /tmp/dansal.log || true
          echo "=== dansal_web.log ==="; cat /tmp/dansal_web.log || true
          echo "=== dansal_webmin.log ==="; cat /tmp/dansal_webmin.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journeys-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  e2e-a11y:
    name: WCAG 2.1 AA Sweep (${{ matrix.project }})
    needs: plan
    if: needs.plan.outputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build binaries
        run: make build

      - name: Install e2e dependencies
        run: make e2e-install

      - name: Start services
        run: |
          sudo mkdir -p /var/lib/dansal/e2e /var/lib/dansal-web/e2e /etc/dansal/e2e
          # packaging/config.yaml's db_path/images_dir/admin_socket/backup_dir
          # (and web.yaml's db_path/images_dir) all point directly under
          # /var/lib/dansal(-web), not the .../e2e leaf just created above —
          # same root-owned-parent issue as #1522's sed fix, one level up:
          # the unprivileged dansal/dansal_web processes below need to create
          # their socket/DB/images there themselves (#1526).
          sudo chown -R "$(id -u):$(id -g)" /var/lib/dansal /var/lib/dansal-web
          sudo cp packaging/config.yaml /etc/dansal/e2e/config.yaml
          sudo cp packaging/web.yaml /etc/dansal/e2e/web.yaml
          sudo cp packaging/webmin.yaml /etc/dansal/e2e/webmin.yaml
          # These configs were just copied in with `sudo cp`, so they (and the
          # /etc/dansal/e2e dir sed -i needs to write its temp file into) are
          # root-owned — every in-place edit below needs sudo too, or sed
          # fails with "Permission denied" creating that temp file (#1522).
          sudo sed -i 's/port: 8000/port: 18000/' /etc/dansal/e2e/config.yaml
          # Server.Listen (set explicitly below) takes precedence over
          # Server.Port for the actual bind address — Port only defaults
          # Listen when Listen is empty (cmd/dansal/config.go) — so the
          # port: sed above never affected what dansal actually binds to.
          # Without this, dansal always listened on :8000, not :18000 (#1529).
          sudo sed -i 's/listen: "127.0.0.1:8000"/listen: "127.0.0.1:18000"/' /etc/dansal/e2e/config.yaml
          grep -q 'listen: "127.0.0.1:18000"' /etc/dansal/e2e/config.yaml
          # The suite drives the API directly on loopback (no shared-secret
          # exemption), so every spec's seed calls share one per-IP bucket;
          # the packaging default of 100/min is exhausted mid-run (#1345).
          sudo sed -i 's/^  rate_limit: 100$/  rate_limit: 1000/' /etc/dansal/e2e/config.yaml
          grep -q '^  rate_limit: 1000$' /etc/dansal/e2e/config.yaml
