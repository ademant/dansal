        run: |
          echo "=== dansal.log ==="; cat /tmp/dansal.log || true
          echo "=== dansal_web.log ==="; cat /tmp/dansal_web.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-${{ matrix.project }}
          path: |
