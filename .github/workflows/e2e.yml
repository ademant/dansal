name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-journeys:
    name: Playwright Journeys (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build binaries
        run: make build

      - name: Install e2e dependencies
        run: make e2e-install

      - name: Start services
        run: |
          sudo mkdir -p /var/lib/dansal/e2e /var/lib/dansal-web/e2e /etc/dansal/e2e
          sudo cp packaging/config.yaml /etc/dansal/e2e/config.yaml
          sudo cp packaging/web.yaml /etc/dansal/e2e/web.yaml
          sudo cp packaging/webmin.yaml /etc/dansal/e2e/webmin.yaml
          sed -i 's/port: 8000/port: 18000/' /etc/dansal/e2e/config.yaml
          sed -i 's/listen: :8080/listen: :18080/' /etc/dansal/e2e/web.yaml
          sed -i 's/listen: :8090/listen: :18090/' /etc/dansal/e2e/webmin.yaml
          ./dansal --config /etc/dansal/e2e/config.yaml &
          sleep 2
          ./dansal_web --config /etc/dansal/e2e/web.yaml &
          sleep 2

      - name: Run journey tests
        run: |
          cd e2e
          npx playwright test --project=${{ matrix.project }} tests/journeys/
        env:
          BASE_URL: http://localhost:18080
          API_URL: http://localhost:18000
          ADMIN_SOCKET: /var/lib/dansal/dansal.sock
          ADMIN_NO_SUDO: "1"
          WEB_DB_PATH: /var/lib/dansal-web/web.db

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journeys-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  e2e-a11y:
    name: WCAG 2.1 AA Sweep (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build binaries
        run: make build

      - name: Install e2e dependencies
        run: make e2e-install

      - name: Start services
        run: |
          sudo mkdir -p /var/lib/dansal/e2e /var/lib/dansal-web/e2e /etc/dansal/e2e
          sudo cp packaging/config.yaml /etc/dansal/e2e/config.yaml
          sudo cp packaging/web.yaml /etc/dansal/e2e/web.yaml
          sudo cp packaging/webmin.yaml /etc/dansal/e2e/webmin.yaml
          sed -i 's/port: 8000/port: 18000/' /etc/dansal/e2e/config.yaml
          sed -i 's/listen: :8080/listen: :18080/' /etc/dansal/e2e/web.yaml
          sed -i 's/listen: :8090/listen: :18090/' /etc/dansal/e2e/webmin.yaml
          ./dansal --config /etc/dansal/e2e/config.yaml &
          sleep 2
          ./dansal_web --config /etc/dansal/e2e/web.yaml &
          sleep 2

      - name: Run accessibility sweep
        run: |
          cd e2e
          npx playwright test --project=${{ matrix.project }} tests/accessibility/
        env:
          BASE_URL: http://localhost:18080
          API_URL: http://localhost:18000
          ADMIN_SOCKET: /var/lib/dansal/dansal.sock
          ADMIN_NO_SUDO: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
