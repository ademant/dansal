name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build all binaries
        run: make build

  package:
    name: Package (.deb)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: sudo apt-get install -y dpkg-dev

      - name: Build all binaries
        run: make build

      - name: Build amd64 .deb
        run: |
          DEB_VERSION="${GITHUB_REF_NAME#v}"
          make deb DEB_VERSION="${DEB_VERSION}" DEB_ARCH=amd64

      - name: Install arm64 build dependencies
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build arm64 .deb
        run: |
          DEB_VERSION="${GITHUB_REF_NAME#v}"
          make deb DEB_VERSION="${DEB_VERSION}" DEB_ARCH=arm64
        env:
          CGO_ENABLED: "1"
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.deb'
          generate_release_notes: true
