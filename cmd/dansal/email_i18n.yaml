# Texts of the registration emails (#1809), sent in the language the applicant
# used on the registration form (pending_registrations.lang). Languages:
# br ca cs de en es fr it nl pl pt uk. The empty language (rows from before
# the lang column) uses the site default de; an unknown one falls back to en.
# Placeholders are fmt verbs: see email_i18n.go for the argument order.
# The translations other than en/de need a native-speaker review.
de:
  subject_verify: "Bestätige deine Registrierung"
  verify: "Du hast ein Konto in diesem Veranstaltungskalender angefragt. Bitte bestätige deine E-Mail-Adresse:\n\n%s\n\nDer Link ist 72 Stunden gültig. Wenn du das nicht angefragt hast, kannst du diese E-Mail ignorieren."
  subject_approved: "Deine Registrierung wurde genehmigt"
  approved_password: "Deine Registrierung wurde genehmigt. Du kannst dich jetzt mit dem Passwort anmelden, das du festgelegt hast.\n\nAnmelden: %s"
  approved_passkey: "Deine Registrierung wurde genehmigt. Du kannst dich jetzt mit dem Passkey anmelden, den du eingerichtet hast.\n\nAnmelden: %s"
  approved_invite: "Deine Registrierung wurde genehmigt.\n\nMit dem Link unten schließt du die Einrichtung deines Kontos ab. Die Seite führt dich durch die Wahl, wie du dich anmelden möchtest.\n\n%s\n\nDer Link ist %d Stunden gültig."
  subject_rejected: "Registrierung nicht genehmigt"
  rejected: "Deine Registrierung wurde nicht genehmigt.\n\nAlle eingereichten Daten wurden gelöscht. Du kannst dich jederzeit mit derselben E-Mail-Adresse erneut registrieren."
  rejected_reason: "Deine Registrierung wurde nicht genehmigt.\n\nGrund: %s\n\nAlle eingereichten Daten wurden gelöscht. Du kannst dich jederzeit mit derselben E-Mail-Adresse erneut registrieren."
en:
  subject_verify: "Confirm your registration"
  verify: "You requested an account on this event calendar. Please confirm your email address:\n\n%s\n\nThis link expires in 72 hours. If you did not request this, you can ignore this email."
  subject_approved: "Your registration was approved"
  approved_password: "Your registration has been approved. You can now sign in with the password you set.\n\nSign in: %s"
  approved_passkey: "Your registration has been approved. You can now sign in with the passkey you registered.\n\nSign in: %s"
  approved_invite: "Your registration has been approved.\n\nUse the link below to complete your account setup. The setup page will guide you through choosing how you want to sign in.\n\n%s\n\nThe link is valid for %d hours."
  subject_rejected: "Registration not approved"
  rejected: "Your registration request was not approved.\n\nAll submitted data has been deleted. You are welcome to register again at any time using the same email address."
  rejected_reason: "Your registration request was not approved.\n\nReason: %s\n\nAll submitted data has been deleted. You are welcome to register again at any time using the same email address."
br:
  subject_verify: "Kadarnait ho enrolladenn"
  verify: "Goulennet ho peus ur gont en deiziadur-mañ. Kadarnait ho chomlec'h postel, mar plij:\n\n%s\n\nEont a ra al liamm-mañ e-pad 72 eur. Ma n'ho peus ket goulennet, gallout a rit dilezel ar postel-mañ."
  subject_approved: "Aprouet eo bet ho enrolladenn"
  approved_password: "Aprouet eo bet ho enrolladenn. Gallout a rit kevreañ bremañ gant ar ger-tremen hoc'h eus lakaet.\n\nKevreañ: %s"
  approved_passkey: "Aprouet eo bet ho enrolladenn. Gallout a rit kevreañ bremañ gant ar passkey hoc'h eus enrollet.\n\nKevreañ: %s"
  approved_invite: "Aprouet eo bet ho enrolladenn.\n\nEvit echuiñ kefluniañ ho kont, implijit al liamm amañ dindan. Ar bajenn a gendalc'h ac'hanoc'h evit dibab an doare kevreañ.\n\n%s\n\nMat eo al liamm e-pad %d eur."
  subject_rejected: "Enrolladenn disaprouet"
  rejected: "Ne oa ket aprouet ho ceulad enrollañ.\n\nKement a oa roet a zo bet diverket. Degemer a reer ac'hanoc'h en-dro, a-viskoazh, gant ar memes chomlec'h postel."
  rejected_reason: "Ne oa ket aprouet ho ceulad enrollañ.\n\nAbeg: %s\n\nKement a oa roet a zo bet diverket. Degemer a reer ac'hanoc'h en-dro, a-viskoazh, gant ar memes chomlec'h postel."
ca:
  subject_verify: "Confirma el teu registre"
  verify: "Has sol·licitat un compte en aquest calendari d'esdeveniments. Confirma la teva adreça de correu electrònic:\n\n%s\n\nAquest enllaç caduca en 72 hores. Si no ho has sol·licitat, pots ignorar aquest correu."
  subject_approved: "El teu registre ha estat aprovat"
  approved_password: "El teu registre ha estat aprovat. Ara pots iniciar sessió amb la contrasenya que has establert.\n\nIniciar sessió: %s"
  approved_passkey: "El teu registre ha estat aprovat. Ara pots iniciar sessió amb la clau d'accés que has registrat.\n\nIniciar sessió: %s"
  approved_invite: "El teu registre ha estat aprovat.\n\nUtilitza l'enllaç següent per completar la configuració del compte. La pàgina et guiarà per triar com vols iniciar sessió.\n\n%s\n\nL'enllaç és vàlid durant %d hores."
  subject_rejected: "Registre no aprovat"
  rejected: "La teva sol·licitud de registre no ha estat aprovada.\n\nTotes les dades enviades s'han eliminat. Pots tornar a registrar-te en qualsevol moment amb la mateixa adreça de correu electrònic."
  rejected_reason: "La teva sol·licitud de registre no ha estat aprovada.\n\nMotiu: %s\n\nTotes les dades enviades s'han eliminat. Pots tornar a registrar-te en qualsevol moment amb la mateixa adreça de correu electrònic."
cs:
  subject_verify: "Potvrďte svou registraci"
  verify: "Požádali jste o účet v tomto kalendáři akcí. Potvrďte prosím svou e-mailovou adresu:\n\n%s\n\nTento odkaz vyprší za 72 hodin. Pokud jste o účet nežádali, můžete tento e-mail ignorovat."
  subject_approved: "Vaše registrace byla schválena"
  approved_password: "Vaše registrace byla schválena. Nyní se můžete přihlásit heslem, které jste nastavili.\n\nPřihlášení: %s"
  approved_passkey: "Vaše registrace byla schválena. Nyní se můžete přihlásit pomocí passkey, které jste zaregistrovali.\n\nPřihlášení: %s"
  approved_invite: "Vaše registrace byla schválena.\n\nPomocí odkazu níže dokončete nastavení účtu. Stránka vás provede výběrem způsobu přihlášení.\n\n%s\n\nOdkaz je platný %d hodin."
  subject_rejected: "Registrace nebyla schválena"
  rejected: "Vaše žádost o registraci nebyla schválena.\n\nVšechna odeslaná data byla smazána. Můžete se kdykoli znovu zaregistrovat se stejnou e-mailovou adresou."
  rejected_reason: "Vaše žádost o registraci nebyla schválena.\n\nDůvod: %s\n\nVšechna odeslaná data byla smazána. Můžete se kdykoli znovu zaregistrovat se stejnou e-mailovou adresou."
es:
  subject_verify: "Confirma tu registro"
  verify: "Has solicitado una cuenta en este calendario de eventos. Confirma tu dirección de correo electrónico:\n\n%s\n\nEste enlace caduca en 72 horas. Si no lo has solicitado, puedes ignorar este correo."
  subject_approved: "Tu registro ha sido aprobado"
  approved_password: "Tu registro ha sido aprobado. Ya puedes iniciar sesión con la contraseña que has elegido.\n\nIniciar sesión: %s"
  approved_passkey: "Tu registro ha sido aprobado. Ya puedes iniciar sesión con la clave de acceso que registraste.\n\nIniciar sesión: %s"
  approved_invite: "Tu registro ha sido aprobado.\n\nUsa el enlace de abajo para completar la configuración de tu cuenta. La página te guiará para elegir cómo quieres iniciar sesión.\n\n%s\n\nEl enlace es válido durante %d horas."
  subject_rejected: "Registro no aprobado"
  rejected: "Tu solicitud de registro no ha sido aprobada.\n\nTodos los datos enviados se han eliminado. Puedes volver a registrarte en cualquier momento con la misma dirección de correo electrónico."
  rejected_reason: "Tu solicitud de registro no ha sido aprobada.\n\nMotivo: %s\n\nTodos los datos enviados se han eliminado. Puedes volver a registrarte en cualquier momento con la misma dirección de correo electrónico."
fr:
  subject_verify: "Confirmez votre inscription"
  verify: "Vous avez demandé un compte sur ce calendrier d'événements. Veuillez confirmer votre adresse e-mail :\n\n%s\n\nCe lien expire dans 72 heures. Si vous n'avez pas fait cette demande, vous pouvez ignorer ce message."
  subject_approved: "Votre inscription a été approuvée"
  approved_password: "Votre inscription a été approuvée. Vous pouvez maintenant vous connecter avec le mot de passe que vous avez choisi.\n\nConnexion : %s"
  approved_passkey: "Votre inscription a été approuvée. Vous pouvez maintenant vous connecter avec la clé d'accès que vous avez enregistrée.\n\nConnexion : %s"
  approved_invite: "Votre inscription a été approuvée.\n\nUtilisez le lien ci-dessous pour finaliser la configuration de votre compte. La page vous guidera pour choisir votre mode de connexion.\n\n%s\n\nLe lien est valable %d heures."
  subject_rejected: "Inscription non approuvée"
  rejected: "Votre demande d'inscription n'a pas été approuvée.\n\nToutes les données transmises ont été supprimées. Vous pouvez vous réinscrire à tout moment avec la même adresse e-mail."
  rejected_reason: "Votre demande d'inscription n'a pas été approuvée.\n\nMotif : %s\n\nToutes les données transmises ont été supprimées. Vous pouvez vous réinscrire à tout moment avec la même adresse e-mail."
it:
  subject_verify: "Conferma la tua registrazione"
  verify: "Hai richiesto un account su questo calendario degli eventi. Conferma il tuo indirizzo e-mail:\n\n%s\n\nIl link scade tra 72 ore. Se non l'hai richiesto, puoi ignorare questa e-mail."
  subject_approved: "La tua registrazione è stata approvata"
  approved_password: "La tua registrazione è stata approvata. Ora puoi accedere con la password che hai impostato.\n\nAccedi: %s"
  approved_passkey: "La tua registrazione è stata approvata. Ora puoi accedere con la passkey che hai registrato.\n\nAccedi: %s"
  approved_invite: "La tua registrazione è stata approvata.\n\nUsa il link qui sotto per completare la configurazione del tuo account. La pagina ti guiderà nella scelta di come accedere.\n\n%s\n\nIl link è valido per %d ore."
  subject_rejected: "Registrazione non approvata"
  rejected: "La tua richiesta di registrazione non è stata approvata.\n\nTutti i dati inviati sono stati eliminati. Puoi registrarti di nuovo in qualsiasi momento con lo stesso indirizzo e-mail."
  rejected_reason: "La tua richiesta di registrazione non è stata approvata.\n\nMotivo: %s\n\nTutti i dati inviati sono stati eliminati. Puoi registrarti di nuovo in qualsiasi momento con lo stesso indirizzo e-mail."
nl:
  subject_verify: "Bevestig je registratie"
  verify: "Je hebt een account aangevraagd op deze evenementenkalender. Bevestig je e-mailadres:\n\n%s\n\nDe link verloopt over 72 uur. Als jij dit niet hebt aangevraagd, kun je deze e-mail negeren."
  subject_approved: "Je registratie is goedgekeurd"
  approved_password: "Je registratie is goedgekeurd. Je kunt je nu aanmelden met het wachtwoord dat je hebt ingesteld.\n\nAanmelden: %s"
  approved_passkey: "Je registratie is goedgekeurd. Je kunt je nu aanmelden met de passkey die je hebt geregistreerd.\n\nAanmelden: %s"
  approved_invite: "Je registratie is goedgekeurd.\n\nGebruik de onderstaande link om je account in te stellen. De pagina begeleidt je bij het kiezen van je aanmeldmethode.\n\n%s\n\nDe link is %d uur geldig."
  subject_rejected: "Registratie niet goedgekeurd"
  rejected: "Je registratieaanvraag is niet goedgekeurd.\n\nAlle ingediende gegevens zijn verwijderd. Je kunt je altijd opnieuw registreren met hetzelfde e-mailadres."
  rejected_reason: "Je registratieaanvraag is niet goedgekeurd.\n\nReden: %s\n\nAlle ingediende gegevens zijn verwijderd. Je kunt je altijd opnieuw registreren met hetzelfde e-mailadres."
pl:
  subject_verify: "Potwierdź swoją rejestrację"
  verify: "Zażądano konta w tym kalendarzu wydarzeń. Potwierdź swój adres e-mail:\n\n%s\n\nTen link wygasa za 72 godziny. Jeśli nie zażądano tego przez Ciebie, możesz zignorować tę wiadomość."
  subject_approved: "Twoja rejestracja została zatwierdzona"
  approved_password: "Twoja rejestracja została zatwierdzona. Możesz teraz zalogować się hasłem, które ustawiłeś.\n\nZaloguj się: %s"
  approved_passkey: "Twoja rejestracja została zatwierdzona. Możesz teraz zalogować się kluczem dostępu, który zarejestrowałeś.\n\nZaloguj się: %s"
  approved_invite: "Twoja rejestracja została zatwierdzona.\n\nUżyj poniższego linku, aby dokończyć konfigurację konta. Strona przeprowadzi Cię przez wybór sposobu logowania.\n\n%s\n\nLink jest ważny przez %d godzin."
  subject_rejected: "Rejestracja nie została zatwierdzona"
  rejected: "Twoje zgłoszenie rejestracyjne nie zostało zatwierdzone.\n\nWszystkie przesłane dane zostały usunięte. Możesz zarejestrować się ponownie w dowolnym momencie, używając tego samego adresu e-mail."
  rejected_reason: "Twoje zgłoszenie rejestracyjne nie zostało zatwierdzone.\n\nPowód: %s\n\nWszystkie przesłane dane zostały usunięte. Możesz zarejestrować się ponownie w dowolnym momencie, używając tego samego adresu e-mail."
pt:
  subject_verify: "Confirme o seu registo"
  verify: "Pediu uma conta neste calendário de eventos. Confirme o seu endereço de e-mail:\n\n%s\n\nEsta ligação expira em 72 horas. Se não fez este pedido, pode ignorar este e-mail."
  subject_approved: "O seu registo foi aprovado"
  approved_password: "O seu registo foi aprovado. Já pode iniciar sessão com a palavra-passe que definiu.\n\nIniciar sessão: %s"
  approved_passkey: "O seu registo foi aprovado. Já pode iniciar sessão com a chave de acesso que registou.\n\nIniciar sessão: %s"
  approved_invite: "O seu registo foi aprovado.\n\nUse a ligação abaixo para concluir a configuração da sua conta. A página guiá-lo-á na escolha de como quer iniciar sessão.\n\n%s\n\nA ligação é válida durante %d horas."
  subject_rejected: "Registo não aprovado"
  rejected: "O seu pedido de registo não foi aprovado.\n\nTodos os dados enviados foram eliminados. Pode voltar a registar-se a qualquer momento com o mesmo endereço de e-mail."
  rejected_reason: "O seu pedido de registo não foi aprovado.\n\nMotivo: %s\n\nTodos os dados enviados foram eliminados. Pode voltar a registar-se a qualquer momento com o mesmo endereço de e-mail."
uk:
  subject_verify: "Підтвердіть вашу реєстрацію"
  verify: "Ви запросили обліковий запис у цьому календарі подій. Будь ласка, підтвердіть свою адресу електронної пошти:\n\n%s\n\nЦе посилання дійсне 72 години. Якщо ви цього не запитували, можете проігнорувати цей лист."
  subject_approved: "Вашу реєстрацію схвалено"
  approved_password: "Вашу реєстрацію схвалено. Тепер ви можете увійти, використовуючи пароль, який встановили.\n\nВхід: %s"
  approved_passkey: "Вашу реєстрацію схвалено. Тепер ви можете увійти, використовуючи ключ доступу, який зареєстрували.\n\nВхід: %s"
  approved_invite: "Вашу реєстрацію схвалено.\n\nСкористайтеся посиланням нижче, щоб завершити налаштування облікового запису. Сторінка допоможе вибрати спосіб входу.\n\n%s\n\nПосилання дійсне %d годин."
  subject_rejected: "Реєстрацію не схвалено"
  rejected: "Вашу заявку на реєстрацію не схвалено.\n\nУсі надіслані дані видалено. Ви можете зареєструватися знову в будь-який час з тією самою адресою електронної пошти."
  rejected_reason: "Вашу заявку на реєстрацію не схвалено.\n\nПричина: %s\n\nУсі надіслані дані видалено. Ви можете зареєструватися знову в будь-який час з тією самою адресою електронної пошти."
