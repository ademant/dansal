{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>{{.Strings.T "admin_dances_title"}}</h1>
</div>

{{with .Data}}
<div class="table-wrap">
<table class="event-table" data-sortable>
  <thead>
    <tr>
      <th data-sort="str">{{$.Strings.T "col_name"}}</th>
      <th>{{$.Strings.T "admin_dance_description"}}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
  {{range .Dances}}
  <tr>
    <td>{{.Name}}</td>
    <td class="col-dance-desc">
      <form method="post" action="/admin/dances/{{.ID}}/edit" class="dance-desc-form">
        <input type="hidden" name="name" value="{{.Name}}">
        <textarea name="description" rows="2" placeholder="{{$.Strings.T "admin_dance_description_placeholder"}}">{{.Description}}</textarea>
        <button type="submit" class="btn-sm-secondary">{{$.Strings.T "admin_save"}}</button>
      </form>
    </td>
    <td class="col-actions">
      <button type="button" class="btn-icon btn-del" title="{{$.Strings.T "admin_delete"}}" aria-label="{{$.Strings.T "admin_delete"}}"
              data-confirm="{{$.Strings.T "admin_dance_confirm_delete"}}" data-fn="deleteDance" data-args="{{dargs .ID}}">🗑️</button>
    </td>
  </tr>
  {{end}}
  </tbody>
</table>
</div>

<div class="add-section">
  <h2>{{$.Strings.T "admin_dance_add_title"}}</h2>
  <form method="post" action="/admin/dances" class="add-form">
    <input type="text" name="name" placeholder="{{$.Strings.T "admin_dance_name_placeholder"}}" required>
    <button type="submit" class="btn-primary">{{$.Strings.T "admin_dance_add_btn"}}</button>
  </form>
</div>
{{end}}

<style>
.page-header{display:flex;align-items:center;gap:1rem;margin-bottom:.5rem}
.page-header h1{margin:0}
.col-actions{white-space:nowrap}
.col-dance-desc{min-width:20rem}
.dance-desc-form{display:flex;gap:.4rem;align-items:flex-start}
.dance-desc-form textarea{flex:1;padding:.3rem .5rem;border:1px solid #ccc;border-radius:4px;font-size:.85rem;font-family:inherit;resize:vertical}
.btn-sm-secondary{padding:.3rem .7rem;background:var(--btn-bg,#eee);color:var(--fg,#333);border:1px solid #ccc;border-radius:4px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn-sm-secondary:hover{background:var(--btn-bg-h,#ddd)}
.btn-del{background:#b00020;color:#fff;border:none}
.btn-del:hover{background:#800016}
.add-section{margin-top:2rem}
.add-section h2{font-size:1.1rem;margin-bottom:.75rem}
.add-form{display:flex;gap:.5rem;align-items:center}
.add-form input{padding:.4rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:.95rem;min-width:220px}
.btn-primary{padding:.4rem 1rem;background:#1a6eb5;color:#fff;border:none;border-radius:4px;font-size:.9rem;cursor:pointer}
.btn-primary:hover{background:#0d4a80}
</style>
<script nonce="{{$.Nonce}}">
document.querySelectorAll('table[data-sortable]').forEach(initSortable);
function deleteDance(id){var f=document.createElement('form');f.method='post';f.action='/admin/dances/'+id+'/delete';document.body.appendChild(f);f.submit();}
</script>
{{end}}
