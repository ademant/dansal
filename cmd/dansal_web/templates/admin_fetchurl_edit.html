{{template "base" .}}
{{define "content"}}
<h1>{{.Strings.T "admin_edit"}} — {{with .Data}}{{.Source.URL}}{{end}}</h1>

<div class="edit-wrap">
{{with .Data}}
{{if .ErrorKey}}<p class="form-error" role="alert">{{$.Strings.T .ErrorKey}}</p>{{end}}

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="fetch-action-bar">
  <button type="button" id="back-btn" class="btn-secondary" onclick="safeGoBack()" title="{{$.Strings.T "btn_go_back"}}" aria-label="{{$.Strings.T "btn_go_back"}}">←</button>
  <button type="submit" id="save-btn" class="btn-primary" form="fetch-edit-form">{{$.Strings.T "admin_save"}}</button>
  <button type="button" id="test-btn" class="btn-secondary" onclick="testFeed()">{{$.Strings.T "fetch_test"}}</button>
  {{if .Source.ID}}<button type="button" id="run-btn" class="btn-secondary" data-run-url="/admin/fetchurls/{{.Source.ID}}/run">{{$.Strings.T "fetch_run"}}</button>{{end}}
</div>

<form method="post" class="edit-form" id="fetch-edit-form">
  <label>{{$.Strings.T "fetch_url"}}</label>
  <div class="url-row">
    <input type="text" id="fetch-url-input" value="{{.Source.URL}}" disabled class="input-disabled">
    <button type="button" id="copy-url-btn" class="btn-copy" onclick="copyFetchURL(this)" title="{{$.Strings.T "admin_invite_copy"}}" aria-label="{{$.Strings.T "admin_invite_copy"}}">⧉</button>
  </div>

  <label for="type">{{$.Strings.T "fetch_type"}}</label>
  <select id="type" name="type">
    <option value="ical"{{if eq .Source.Type "ical"}} selected{{end}}>iCal</option>
    <option value="rss"{{if eq .Source.Type "rss"}} selected{{end}}>RSS</option>
    <option value="json"{{if or (eq .Source.Type "json") (eq .Source.Type "folkdance-json") (eq .Source.Type "gancio-json")}} selected{{end}}>JSON (auto-detect)</option>
  </select>

  <label for="tags">{{$.Strings.T "fetch_tags"}}</label>
  <input id="tags" type="text" name="tags" value="{{range .Source.Tags}}{{.}} {{end}}">

  <label for="organization_id">{{$.Strings.T "fetch_org"}}</label>
  <select id="organization_id" name="organization_id">
    <option value="">—</option>
    {{range .Orgs}}
    <option value="{{.ID}}"{{if $.Data.Source.OrganizationID}}{{if eq (derefInt $.Data.Source.OrganizationID) .ID}} selected{{end}}{{end}}>{{.Name}}</option>
    {{end}}
  </select>

  {{if .Dances}}
  <label>Dance styles</label>
  <div class="dance-checkboxes">
    {{range .Dances}}
    <label class="check-label"><input type="checkbox" name="dance_ids" value="{{.ID}}"{{if index $.Data.SelectedDanceNames .Name}} checked{{end}}> {{.Name}}</label>
    {{end}}
  </div>
  {{end}}

  {{if .Templates}}
  <label for="template_id">{{$.Strings.T "admin_fetchurl_template_label"}}</label>
  <select id="template_id" name="template_id">
    <option value="">—</option>
    {{range .Templates}}
    <option value="{{.ID}}"{{if $.Data.Source.TemplateID}}{{if eq (derefInt $.Data.Source.TemplateID) .ID}} selected{{end}}{{end}}>{{.Name}}</option>
    {{end}}
  </select>

  <label for="template_mode">{{$.Strings.T "admin_fetchurl_template_mode_label"}}</label>
  <select id="template_mode" name="template_mode">
    <option value="fetch_master"{{if eq .Source.TemplateMode "fetch_master"}} selected{{end}}>{{$.Strings.T "admin_fetchurl_template_mode_fetch"}}</option>
    <option value="template_master"{{if eq .Source.TemplateMode "template_master"}} selected{{end}}>{{$.Strings.T "admin_fetchurl_template_mode_tpl"}}</option>
  </select>
  {{end}}

</form>
{{end}}
</div>

<style>
.edit-wrap{max-width:560px}
.form-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:4px;padding:.6rem .9rem;margin-bottom:1rem;font-size:.9rem}
.fetch-action-bar{position:sticky;top:0;z-index:40;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ddd;padding:.6rem 0;margin-bottom:1rem}
.edit-form{display:flex;flex-direction:column;gap:.6rem;background:#fff;border:1px solid #ddd;border-radius:6px;padding:1.5rem}
.edit-form label{font-weight:600;font-size:.9rem;color:#444}
.edit-form input,.edit-form select{padding:.45rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:1rem;width:100%}
.edit-form input:focus,.edit-form select:focus{outline:2px solid #1a6eb5;border-color:#1a6eb5}
.input-disabled{background:#f5f5f5;color:#666}
.url-row{display:flex;gap:.4rem;align-items:center}
.url-row input{flex:1}
.btn-copy{flex-shrink:0;padding:.45rem .65rem;background:#f5f5f5;color:#333;border:1px solid #ccc;border-radius:4px;font-size:1rem;cursor:pointer;line-height:1}
.btn-copy:hover{background:#e8e8e8}
.dance-checkboxes{display:flex;flex-wrap:wrap;gap:.25rem .5rem;margin:.25rem 0}
.check-label{display:flex;align-items:center;gap:.35rem;font-size:.92rem;cursor:pointer;font-weight:normal}
.check-label input{width:auto}
.btn-primary{padding:.45rem 1.2rem;background:#1a6eb5;color:#fff;border:none;border-radius:4px;font-size:.95rem;cursor:pointer}
.btn-primary:hover{background:#0d4a80}
.btn-secondary{padding:.45rem 1.2rem;background:#f5f5f5;color:#333;border:1px solid #ccc;border-radius:4px;font-size:.95rem;text-decoration:none;cursor:pointer}
.btn-secondary:hover{background:#e8e8e8}
.toast{position:fixed;top:1.2rem;left:50%;transform:translateX(-50%) translateY(-120%);padding:.65rem 1.4rem;border-radius:6px;font-size:.95rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.toast-show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-ok{background:#1e7e34;color:#fff}
.toast-err{background:#b00020;color:#fff}
</style>
<script>
var toastTimer;
function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err') + ' toast-show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 5000);
}
(function(){
  var btn = document.getElementById('run-btn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var url = btn.dataset.runUrl;
    btn.disabled = true;
    fetch(url, {method: 'POST', headers: {Accept: 'application/json'}})
      .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, data: d}; }); })
      .then(function(res) {
        if (res.ok) {
          showToast(res.data.count + ' {{$.Strings.T "fetch_run_result"}}', true);
        } else {
          showToast(res.data.error || '{{$.Strings.T "fetch_run_error"}}', false);
        }
      })
      .catch(function(){ showToast('{{$.Strings.T "fetch_run_error"}}', false); })
      .finally(function(){ btn.disabled = false; });
  });
})();
function copyFetchURL(btn){
  var url=document.getElementById('fetch-url-input').value;
  navigator.clipboard.writeText(url).then(function(){
    var orig=btn.textContent;btn.textContent='✓';
    setTimeout(function(){btn.textContent=orig;},1500);
  });
}
function testFeed(){
  var url=document.getElementById('fetch-url-input').value;
  try {
    var u=new URL(url,window.location.href);
    if(u.protocol!=='http:'&&u.protocol!=='https:') return;
    window.open(u.href,'_blank','noopener,noreferrer,width=900,height=700');
  } catch(e) {}
}
var _formDirty=false;
function _markDirty(){
  if(_formDirty) return;
  _formDirty=true;
  window.addEventListener('beforeunload',function(e){
    if(!_formDirty) return;
    e.preventDefault();
    e.returnValue='';
  });
}
function safeGoBack(){
  if(_formDirty&&!confirm('{{$.Strings.T "admin_unsaved_confirm"}}')){return;}
  _formDirty=false;
  if(window.history.length>1){history.back();}else{location.href='/admin/fetchurls';}
}
(function(){
  var form=document.getElementById('fetch-edit-form');
  if(!form) return;
  form.addEventListener('input',_markDirty);
  form.addEventListener('change',_markDirty);
  form.addEventListener('submit',function(){_formDirty=false;});
})();
</script>
{{end}}
