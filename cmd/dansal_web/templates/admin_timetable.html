{{template "base" .}}
{{define "head_extra"}}
<style>
.tt-editor-page{max-width:none;padding:0 1rem 2rem}
.tt-action-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem 0 .75rem;flex-wrap:wrap}
.tt-action-bar .save-status{font-size:.85rem;color:var(--fg-dim);margin-left:.5rem}
.tt-room-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem;min-height:2rem}
.tt-room-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg-subtle);border:1px solid var(--border-mid);border-radius:12px;padding:.15rem .6rem;font-size:.82rem;cursor:default}
.tt-room-chip button{background:none;border:none;cursor:pointer;color:var(--fg-dim);font-size:.9rem;padding:0 .1rem;line-height:1}
.tt-room-chip button:hover{color:var(--danger)}
.tt-room-add-wrap{display:inline-flex;align-items:center;gap:.3rem;position:relative}
.tt-room-add-input{border:1px dashed var(--border-mid);border-radius:12px;padding:.15rem .6rem;font-size:.82rem;width:120px;background:transparent;color:var(--fg)}
.tt-room-add-input:focus{outline:2px solid var(--primary);border-color:transparent}
.tt-room-suggest{position:absolute;top:100%;left:0;z-index:100;background:var(--bg-card);border:1px solid var(--border-mid);border-radius:6px;list-style:none;padding:.2rem 0;margin:2px 0 0;min-width:150px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tt-room-suggest li{padding:.3rem .7rem;cursor:pointer;font-size:.85rem}
.tt-room-suggest li:hover,.tt-room-suggest li.active{background:var(--bg-hover)}
/* per-event track palette (#1174) — same visual language as the room-add chip above */
/* <input type=color> ignores outer width/height for its actual swatch in
   Chrome/Firefox unless the internal wrapper/swatch padding is zeroed too
   — without these, the element still renders visually wide regardless of
   the box size set above. Selector is qualified as ".tt-popup-field
   input.tt-track-color" (specificity 0,2,1), not just ".tt-track-color"
   (0,1,0) — the generic ".tt-popup-field input{width:100%;padding:.35rem
   .5rem}" rule below has specificity 0,1,1, which beat the plain-class
   version regardless of source order and is why an earlier fix here
   didn't actually take effect. */
.tt-popup-field input.tt-track-color{width:1.6rem;height:1.6rem;flex:0 0 auto;padding:0;border:1px solid var(--border-mid);border-radius:4px;background:none;cursor:pointer}
.tt-track-color::-webkit-color-swatch-wrapper{padding:0}
.tt-track-color::-webkit-color-swatch{border:none;border-radius:3px}
.tt-track-color::-moz-color-swatch{border:none;border-radius:3px}
.tt-track-add-wrap{display:flex;align-items:center;gap:.4rem}
.tt-track-add-wrap .tt-room-add-input{flex:1;min-width:0;width:auto}
.tt-type-row{display:flex;gap:.4rem;align-items:center}
.tt-type-row select{flex:1;min-width:0}
.tt-page-nav{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.tt-page-nav button{background:none;border:1px solid var(--border-mid);border-radius:4px;padding:.2rem .6rem;cursor:pointer;color:var(--fg)}
.tt-page-nav button:disabled{opacity:.4;cursor:default}
.tt-page-nav .tt-page-label{font-weight:600;min-width:100px;text-align:center}
.tt-editor-scroll{overflow-x:hidden;overflow-y:auto;max-height:80vh;border:1px solid var(--border-mid);border-radius:6px;background:var(--bg)}
.tt-editor-grid{display:flex;position:relative;width:100%}
.tt-time-axis{width:44px;flex-shrink:0;position:sticky;left:0;z-index:5;background:var(--bg);border-right:1px solid var(--border-mid)}
.tt-axis-header{height:32px;border-bottom:1px solid var(--border-mid);background:var(--bg-subtle)}
.tt-axis-body{position:relative}
.tt-axis-mark{position:absolute;right:6px;font-size:.72rem;color:var(--fg-dim);transform:translateY(-50%);white-space:nowrap;line-height:1}
.tt-axis-line{position:absolute;left:0;right:0;border-top:1px solid var(--border-mid)}
.tt-axis-line.half{border-top:1px dashed var(--border-light,var(--border-mid))}
.tt-day-col{display:flex;flex-direction:column;border-right:1px solid var(--border-mid);flex:1;min-width:0}
.tt-day-col:last-child{border-right:none}
.tt-day-header{height:32px;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;background:var(--bg-subtle);border-bottom:1px solid var(--border-mid);white-space:nowrap;padding:0 .5rem;position:sticky;top:0;z-index:4}
.tt-rooms-header{display:flex;height:0}
.tt-room-col{flex:1;position:relative;min-width:60px}
.tt-room-col-header{position:sticky;top:32px;z-index:3;background:var(--bg-subtle);border-bottom:1px solid var(--border-mid);font-size:.72rem;color:var(--fg-dim);padding:.2rem .4rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.tt-room-col+.tt-room-col{border-left:1px solid var(--border-mid)}
.tt-room-body{position:relative;cursor:crosshair}
.tt-gridline{position:absolute;left:0;right:0;pointer-events:none}
.tt-gridline.hour{border-top:1px solid var(--border-mid)}
.tt-gridline.half{border-top:1px dashed var(--border-light,rgba(128,128,128,.3))}
/* tiles — semi-transparent so overlapping areas are visible */
.tt-panel{position:absolute;left:2px;right:2px;border-radius:5px;padding:.2rem .35rem;overflow:hidden;cursor:grab;box-sizing:border-box;font-size:.78rem;line-height:1.2;user-select:none;touch-action:none;border:1px solid rgba(0,0,0,.2);transition:box-shadow .1s}
.tt-panel:active{cursor:grabbing}
.tt-panel:hover{box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:10}
/* background color is set inline per-entry from the event's own track
   palette (#1174, see trackColor() below) instead of a fixed class list. */
.tt-panel{color:#fff}
.tt-panel .tt-panel-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-panel .tt-panel-sub{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.72rem}
.tt-panel .tt-panel-time{opacity:.75;font-size:.7rem}
/* tt-continues: starts here, ends next day — only round top corners */
.tt-panel.tt-continues{border-radius:5px 5px 0 0}
/* tt-continued: started previous day, ends here — only round bottom corners */
.tt-panel.tt-continued{border-radius:0 0 5px 5px}
/* resize handles */
.tt-rh{position:absolute;left:0;right:0;height:8px;cursor:ns-resize;z-index:2}
.tt-rh-top{top:0}
.tt-rh-bot{bottom:0}
/* ghost tile during new-entry drag (drag-to-create) */
.tt-ghost{position:absolute;left:2px;right:2px;background:rgba(74,127,203,.3);border:2px dashed rgba(74,127,203,.7);border-radius:5px;pointer-events:none;box-sizing:border-box}
/* floating ghost while moving an existing tile across rooms */
.tt-move-ghost{position:fixed;pointer-events:none;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:.88;border-radius:5px}
/* drop-target highlight on a room body */
.tt-room-body.tt-drop-target{background:rgba(74,127,203,.08);outline:2px dashed rgba(74,127,203,.5);outline-offset:-2px}
/* popup */
#tt-popup{border:1px solid var(--border-mid);border-radius:8px;padding:1rem;background:var(--bg-card);color:var(--fg);box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:480px;width:95vw}
#tt-popup::backdrop{background:rgba(0,0,0,.4)}
#tt-popup h2{margin:0 0 .75rem;font-size:1rem}
.tt-popup-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.tt-popup-row.full{grid-template-columns:1fr}
.tt-popup-row.tri{grid-template-columns:1fr 1fr 1fr}
.tt-popup-field{display:flex;flex-direction:column;gap:.2rem}
.tt-popup-field label{font-size:.78rem;color:var(--fg-dim);font-weight:600}
.tt-popup-field input,.tt-popup-field select,.tt-popup-field textarea{background:var(--bg-input,var(--bg));border:1px solid var(--border-mid);border-radius:4px;padding:.35rem .5rem;color:var(--fg);font-size:.88rem;width:100%;box-sizing:border-box}
.tt-popup-field textarea{resize:vertical;min-height:56px}
.tt-popup-actions{display:flex;align-items:center;gap:.5rem;margin-top:.75rem}
.tt-popup-actions .tt-del-entry{margin-left:auto}
/* nav modal */
#tt-nav-modal{border:1px solid var(--border-mid);border-radius:8px;padding:1.25rem;background:var(--bg-card);color:var(--fg);box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:360px}
#tt-nav-modal::backdrop{background:rgba(0,0,0,.4)}
#tt-nav-modal p{margin:0 0 1rem}
#tt-nav-modal .modal-actions{display:flex;flex-direction:column;gap:.5rem}
/* autocomplete */
.tt-ac-wrap{position:relative}
.tt-ac-suggest{position:absolute;top:100%;left:0;right:0;z-index:200;background:var(--bg-card);border:1px solid var(--border-mid);border-radius:4px;list-style:none;padding:.2rem 0;margin:2px 0 0;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tt-ac-suggest li{padding:.3rem .6rem;cursor:pointer;font-size:.84rem}
.tt-ac-suggest li:hover,.tt-ac-suggest li.tt-ac-active{background:var(--bg-hover)}
.tt-ac-suggest li.tt-opt-sep{height:1px;background:var(--border-mid);padding:0;margin:.2rem 0}
.tt-ac-suggest li.tt-create{color:var(--primary)}
</style>
{{end}}
{{define "content"}}
{{with .Data}}
<div class="tt-editor-page">
<h1 style="margin-bottom:.5rem">{{$.Strings.T "evt_timetable"}} — <a href="/admin/events/{{.Event.ID}}/edit">{{.Event.Title}}</a></h1>

<div class="tt-action-bar evt-action-bar">
  <button type="button" class="btn-secondary" id="back-btn" data-fn="safeGoBack" data-args="[]" title="{{$.Strings.T "btn_go_back"}}">←</button>
  <button type="button" class="btn-primary" id="save-btn" data-fn="saveTimetable" data-args="[]" disabled>{{$.Strings.T "admin_save"}}</button>
  <button type="button" class="btn-secondary" id="new-entry-btn" data-fn="newEntry" data-args="[]">{{$.Strings.T "tt_new_entry"}}</button>
  <button type="button" class="btn-secondary" id="sync-btn" data-fn="syncEventTimes" data-args="[]" title="Set event start/end times from timetable entries">⇄ Sync event times</button>
  <button type="button" class="btn-del" data-fn="deleteTimetable" data-args="[]">Delete timetable</button>
  <span class="save-status" id="save-status" hidden></span>
</div>

<div id="tt-room-bar" class="tt-room-bar">
  <span style="font-size:.82rem;color:var(--fg-dim)">Rooms:</span>
  <div id="tt-chips"></div>
  <div class="tt-room-add-wrap">
    <input type="text" class="tt-room-add-input" id="tt-room-add" placeholder="+ Add room…" autocomplete="off"
      data-on="input,focus" data-fn="roomAddInput" data-args='["@this"]' data-on2="keydown" data-fn2="roomAddKeydown" data-args2='["@event","@this"]'>
    <ul class="tt-room-suggest" id="tt-room-suggest" hidden></ul>
  </div>
</div>

<div id="tt-page-nav" class="tt-page-nav" hidden>
  <button type="button" id="tt-prev" data-fn="changePage" data-args="[-1]">‹</button>
  <span class="tt-page-label" id="tt-page-label"></span>
  <button type="button" id="tt-next" data-fn="changePage" data-args="[1]">›</button>
</div>

<div class="tt-editor-scroll">
  <div class="tt-editor-grid" id="tt-editor-grid"></div>
</div>
</div>

<!-- Entry edit popup -->
<dialog id="tt-popup">
  <h2 id="tt-popup-title">Entry</h2>
  <div class="tt-popup-row tri">
    <div class="tt-popup-field"><label>Day</label><select id="pp-day" data-on="change" data-fn="ppDirty" data-args="[]"></select></div>
    <div class="tt-popup-field"><label>Start</label><input type="time" id="pp-start" data-on="input" data-fn="ppDirty" data-args="[]"></div>
    <div class="tt-popup-field"><label>End</label><input type="time" id="pp-end" data-on="input" data-fn="ppDirty" data-args="[]"></div>
  </div>
  <div class="tt-popup-row full">
    <div class="tt-popup-field"><label>Title</label><input type="text" id="pp-title" data-on="input" data-fn="ppDirty" data-args="[]"></div>
  </div>
  <div class="tt-popup-row">
    <div class="tt-popup-field"><label>Track</label>
      <div class="tt-type-row">
        <!-- #1174: options are the event's own track palette (defaults to the
             standard 8-slug palette server-side when no custom tracks are
             set — see defaultTimetableTracks), not a fixed hardcoded list. -->
        <select id="pp-type" data-on="change" data-fn="ppTypeChange" data-args="[]">
          {{range .Event.TimetableTracks}}
          <option value="{{.Slug}}" data-color="{{.Color}}">{{if trackI18nKey .Slug}}{{$.Strings.T (trackI18nKey .Slug)}}{{else}}{{.Name}}{{end}}</option>
          {{end}}
        </select>
        <input type="color" id="pp-type-color" class="tt-track-color" title="Track color" data-on="change" data-fn="ppTypeColorChange" data-args="[]">
      </div>
    </div>
    <div class="tt-popup-field"><label>Room</label>
      <select id="pp-room-sel" data-on="change" data-fn="ppRoomSelChange" data-args="[]">
        <option value="">— none —</option>
      </select>
    </div>
  </div>
  <div class="tt-popup-row full">
    <div class="tt-popup-field"><label>New track</label>
      <div class="tt-track-add-wrap">
        <input type="text" class="tt-room-add-input" id="tt-track-add-name" placeholder="Track name…" autocomplete="off"
          data-on="keydown" data-fn="trackAddKeydown" data-args='["@event"]'>
        <input type="color" id="tt-track-add-color" class="tt-track-color" value="#4a7fcb" title="Track color">
        <button type="button" class="btn-secondary" data-fn="addTrack" data-args="[]">Add track</button>
      </div>
    </div>
  </div>
  <div class="tt-popup-row full tt-ac-wrap">
    <div class="tt-popup-field"><label>Musician</label>
      <input type="text" id="pp-mus-text" autocomplete="off" data-on="input" data-fn="ppMusInput" data-args="[]" data-on2="focus" data-fn2="ppMusOpen" data-args2="[]">
      <input type="hidden" id="pp-mus-id">
    </div>
    <ul class="tt-ac-suggest" id="pp-mus-suggest" hidden></ul>
  </div>
  <div class="tt-popup-row full tt-ac-wrap">
    <div class="tt-popup-field"><label>Instructor</label>
      <input type="text" id="pp-ins-text" autocomplete="off" data-on="input" data-fn="ppInsInput" data-args="[]" data-on2="focus" data-fn2="ppInsOpen" data-args2="[]">
      <input type="hidden" id="pp-ins-id">
    </div>
    <ul class="tt-ac-suggest" id="pp-ins-suggest" hidden></ul>
  </div>
  <div class="tt-popup-row full">
    <div class="tt-popup-field"><label>Description</label>
      <textarea id="pp-desc" data-on="input" data-fn="ppDirty" data-args="[]"></textarea>
    </div>
  </div>
  <div class="tt-popup-actions">
    <button type="button" class="btn-primary" data-fn="ppSave" data-args="[]">Save entry</button>
    <button type="button" class="btn-secondary" data-fn="ppCancel" data-args="[]">Cancel</button>
    <button type="button" class="btn-secondary" id="pp-clone-btn" data-fn="ppClone" data-args="[]">{{$.Strings.T "tt_clone_entry"}}</button>
    <button type="button" class="btn-del tt-del-entry" id="pp-del-btn" data-fn="ppDelete" data-args="[]">Delete</button>
  </div>
</dialog>

<!-- Unsaved-changes nav modal -->
<dialog id="tt-nav-modal">
  <p>{{$.Strings.T "admin_unsaved_confirm"}}</p>
  <div class="modal-actions">
    <button type="button" class="btn-primary" data-fn="navModalSaveGo" data-args="[]">Save &amp; leave</button>
    <button type="button" class="btn-del" data-fn="navModalDiscard" data-args="[]">Discard &amp; leave</button>
    <button type="button" class="btn-secondary" data-fn="navModalClose" data-args="[]">Stay</button>
  </div>
</dialog>

<script nonce="{{$.Nonce}}">
// ─── constants ───────────────────────────────────────────────────────────────
var EVT_ID = {{.Event.ID}};
var PX_PER_MIN = 2;
var SNAP = 15;
var MAX_COLS = 6; // max day×room columns before pagination kicks in

// ─── data ────────────────────────────────────────────────────────────────────
var _entries = {{.Timetable | json}};
var _allRooms = {{.Rooms | json}};
// #1174: this event's own track palette (server already substitutes the
// default 8-slug palette when the event has no custom tracks — see
// defaultTimetableTracks / scanEventRow on the API side). The fallback here
// only guards against an unexpected empty list reaching the page.
var _tracks = {{.Event.TimetableTracks | json}};
if(!_tracks || !_tracks.length){
  _tracks = [
    {slug:'bal',name:'Bal',color:'rgba(74,127,203,.78)'},
    {slug:'concert',name:'Concert',color:'rgba(74,127,203,.78)'},
    {slug:'talk',name:'Talk',color:'rgba(74,127,203,.78)'},
    {slug:'workshop',name:'Workshop',color:'rgba(201,80,10,.78)'},
    {slug:'dance-workshop',name:'Dance workshop',color:'rgba(201,80,10,.78)'},
    {slug:'musician-workshop',name:'Musician workshop',color:'rgba(138,42,176,.78)'},
    {slug:'break',name:'Break',color:'rgba(102,102,102,.78)'},
    {slug:'session',name:'Session',color:'rgba(42,138,74,.78)'},
    {slug:'meal',name:'Meal',color:'rgba(196,158,20,.78)'}
  ];
}
var _allMusicians = (function(){
  var ms = {{.Musicians | json}};
  return ms.map(function(m){return {id:m.id,name:m.bandname||m.name||''};});
})();
var _allInstructors = (function(){
  var ins = {{.Instructors | json}};
  return ins.map(function(i){return {id:i.id,name:i.name||''};});
})();
var _evtStart = "{{.Event.StartTime}}";
var _evtEnd = "{{.Event.EndTime}}";
var _topLocID = {{.TopLocationID}}; // building-level location for room quick-create
var _topLocName = {{.TopLocationName | js}}; // short name of the primary building

// Assign client-side IDs to loaded entries
var _cidCounter = 1;
(function(){
  _entries.forEach(function(e){ e._cid = _cidCounter++; });
})();
function _nextCid(){ return _cidCounter++; }

// ─── state ───────────────────────────────────────────────────────────────────
var _rooms = []; // {id: int|null, label: string} — room columns currently shown
var _days = [];  // ["YYYY-MM-DD", ...]
var _page = 0;   // current page index
var _daysPerPage = 1; // recomputed by computeDaysPerPage()
var _formDirty = false;
var _gridMin = 18*60;  // 18:00
var _gridMax = 28*60;  // 04:00 next day
var _popupEntry = null; // entry currently open in popup (or null for new)
var _popupDay = null;
var _isDragging = false;
var _navTarget = null; // pending navigation URL

// ─── init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
function init(){
  _days = computeDays();
  recomputeTimeRange();
  recomputeRooms();
  renderAll();
  initDirtyGuard();
}

// ─── days ─────────────────────────────────────────────────────────────────────
function computeDays(){
  var start = _evtStart ? new Date(_evtStart) : new Date();
  var end = _evtEnd ? new Date(_evtEnd) : start;
  // Clamp: entries might have entry_date outside event range; include those too
  var entryDates = _entries.map(function(e){ return e.entry_date||''; }).filter(Boolean);
  var days = [];
  var cur = new Date(start);
  cur.setUTCHours(0,0,0,0);
  var last = new Date(end);
  last.setUTCHours(0,0,0,0);
  // add one day margin after end for midnight-spanning entries
  last.setUTCDate(last.getUTCDate()+1);
  while(cur <= last){
    days.push(cur.toISOString().slice(0,10));
    cur.setUTCDate(cur.getUTCDate()+1);
  }
  // include any extra entry_date days
  entryDates.forEach(function(d){
    if(days.indexOf(d)<0) days.push(d);
  });
  days.sort();
  // remove trailing empty days (no entries, past event end)
  while(days.length > 1){
    var ld = days[days.length-1];
    var hasEntry = _entries.some(function(e){ return effectiveDate(e)===ld; });
    var evtEndDate = _evtEnd ? new Date(_evtEnd).toISOString().slice(0,10) : '';
    if(!hasEntry && ld > evtEndDate) days.pop(); else break;
  }
  if(!days.length) days = [new Date().toISOString().slice(0,10)];
  return days;
}

function effectiveDate(e){
  return e.entry_date || (_days.length ? _days[0] : '');
}

// ─── time range ──────────────────────────────────────────────────────────────
function recomputeTimeRange(){
  if(!_entries.length){ _gridMin=18*60; _gridMax=28*60; return; }
  var mn=999, mx=0;
  _entries.forEach(function(e){
    var s=parseHHMM(e.start_time||'18:00');
    var en=parseHHMM(e.end_time||'19:00');
    if(en<s) en+=1440; // crosses midnight
    // convert to absolute minutes
    var sa = s < _gridMin ? s+1440-_gridMin : s-_gridMin; // not exact yet, just gather raw
    mn = Math.min(mn, s);
    mx = Math.max(mx, en);
  });
  // round down to prev hour, round up to next hour
  mn = Math.floor(mn/60)*60;
  mx = Math.ceil(mx/60)*60;
  // ensure at least 2h range
  if(mx-mn < 120) mx = mn+120;
  _gridMin = mn; _gridMax = mx;
}

// Widens (never narrows) the grid's visible time range so a manually-typed
// popup time (from the "+ New entry" button, or hand-edited start/end fields)
// that falls outside the current grid is still visible after saving, instead
// of silently rendering off-screen. Companion to the fixed-range policy in
// ppSave() (#1226) — recomputeTimeRange() is what would narrow it back down,
// which is exactly what we're avoiding.
function growTimeRangeIfNeeded(e){
  var s = parseHHMM(e.start_time||'00:00');
  var en = parseHHMM(e.end_time||'01:00');
  if(en <= s) en += 1440;
  var mn = Math.floor(s/60)*60;
  var mx = Math.ceil(en/60)*60;
  if(mn < _gridMin) _gridMin = mn;
  if(mx > _gridMax) _gridMax = mx;
}

function parseHHMM(t){
  var p=t.split(':'); return parseInt(p[0]||0)*60+parseInt(p[1]||0);
}
function minToHHMM(m){
  m = ((m%1440)+1440)%1440;
  return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);
}
function absOffset(rawMin){
  // convert raw [0..1440) time to absolute offset from _gridMin
  if(rawMin < _gridMin) return rawMin + 1440 - _gridMin;
  return rawMin - _gridMin;
}

// ─── rooms ────────────────────────────────────────────────────────────────────
function recomputeRooms(){
  // build room list from entries' location_id/location_name + explicit _rooms
  var seen = {};
  var out = [];
  // rooms already in _rooms
  _rooms.forEach(function(r){ seen[r.id !== null ? 'id:'+r.id : 'lbl:'+r.label] = true; out.push(r); });
  _entries.forEach(function(e){
    if(e.location_id){
      var k='id:'+e.location_id;
      if(!seen[k]){ seen[k]=true; out.push({id:e.location_id,label:e.location_name||('Room '+e.location_id)}); }
    } else if(e.room){
      var k2='lbl:'+e.room;
      if(!seen[k2]){ seen[k2]=true; out.push({id:null,label:e.room}); }
    }
  });
  _rooms = out;
}

// ─── render all ──────────────────────────────────────────────────────────────
function computeDaysPerPage(){
  var roomCount = _rooms.length + 1; // +1 for "Other" column
  var total = _days.length * roomCount;
  if(total <= MAX_COLS) return _days.length; // show everything
  return Math.max(1, Math.floor(MAX_COLS / roomCount));
}
function renderAll(){
  _daysPerPage = computeDaysPerPage();
  // clamp _page to new total
  var totalPages = Math.ceil(_days.length / _daysPerPage);
  if(_page >= totalPages) _page = Math.max(0, totalPages-1);
  renderRoomChips();
  renderPageNav();
  renderGrid();
}

// ─── room chips ──────────────────────────────────────────────────────────────
function renderRoomChips(){
  var el = document.getElementById('tt-chips');
  el.innerHTML='';
  _rooms.forEach(function(r){
    var chip = document.createElement('span');
    chip.className='tt-room-chip';
    chip.textContent=r.label;
    var btn = document.createElement('button');
    btn.textContent='×';
    btn.title='Remove room column';
    btn.addEventListener('click', function(){ removeRoom(r); });
    chip.appendChild(btn);
    el.appendChild(chip);
  });
}

function removeRoom(r){
  _rooms = _rooms.filter(function(x){ return x !== r; });
  // entries in removed room → keep them, they'll show in "other" column
  _markDirty();
  renderAll();
}

// ─── room add input ──────────────────────────────────────────────────────────
function roomAddInput(inp){
  var q = inp.value.trim().toLowerCase();
  var sug = document.getElementById('tt-room-suggest');
  sug.innerHTML=''; sug.hidden=true;
  var existing = _rooms.map(function(r){ return r.label.toLowerCase(); });
  var hits = _allRooms.filter(function(r){
    var n=(r.label||'').toLowerCase();
    return (!q || n.indexOf(q)!==-1) && existing.indexOf(n)<0;
  }).slice(0,8);
  hits.forEach(function(r){
    var n=r.label||('Room '+r.id);
    var li = document.createElement('li');
    li.textContent=n;
    li.addEventListener('mousedown',function(e){
      e.preventDefault(); inp.value=''; sug.hidden=true;
      addRoom({id:r.id,label:n});
    });
    sug.appendChild(li);
  });
  // offer to create a new room in the DB (or free-text if no venue set)
  if(q && !hits.some(function(r){ return (r.label||'').toLowerCase()===q; })){
    var li = document.createElement('li');
    var lbl = inp.value.trim();
    var createLbl = _topLocID > 0
      ? '+ Create room "' + lbl + '"' + (_topLocName ? ' in ' + _topLocName : '')
      : '+ Add "' + lbl + '"';
    li.textContent = createLbl;
    li.style.fontStyle='italic';
    li.addEventListener('mousedown',function(e){
      e.preventDefault(); inp.value=''; sug.hidden=true;
      if(_topLocID > 0){ roomQuickCreate(lbl); } else { addRoom({id:null,label:lbl}); }
    });
    sug.appendChild(li);
  }
  if(sug.children.length) sug.hidden=false;
}

function roomQuickCreate(name){
  fetch('/admin/api/location/'+_topLocID+'/room/quick-create', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name})
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(room){
    _allRooms.push({id:room.id,label:room.name});
    addRoom({id:room.id,label:room.name});
  }).catch(function(err){
    alert('Could not create room: '+err.message);
  });
}

function roomAddKeydown(e, inp){
  var sug=document.getElementById('tt-room-suggest');
  if(e.key==='Escape'){ sug.hidden=true; inp.value=''; return; }
  if(e.key==='Enter' && !sug.hidden){
    e.preventDefault();
    var first=sug.querySelector('li');
    if(first) first.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true}));
    return;
  }
}

document.addEventListener('click',function(e){
  var sug=document.getElementById('tt-room-suggest');
  if(sug && !sug.contains(e.target) && e.target!==document.getElementById('tt-room-add')) sug.hidden=true;
});

function addRoom(r){
  var exists=_rooms.some(function(x){ return x.id===r.id && x.label===r.label; });
  if(!exists){ _rooms.push(r); _markDirty(); renderAll(); }
}

// ─── page nav ─────────────────────────────────────────────────────────────────
function renderPageNav(){
  var nav = document.getElementById('tt-page-nav');
  var totalPages = Math.ceil(_days.length / _daysPerPage);
  if(totalPages <= 1){ nav.hidden=true; return; }
  nav.hidden=false;
  var startIdx = _page * _daysPerPage;
  var endIdx = Math.min(startIdx + _daysPerPage - 1, _days.length - 1);
  var label = _days[startIdx];
  if(endIdx > startIdx) label += ' – ' + _days[endIdx];
  document.getElementById('tt-page-label').textContent = label;
  document.getElementById('tt-prev').disabled = _page===0;
  document.getElementById('tt-next').disabled = _page===totalPages-1;
}
function changePage(d){
  var totalPages = Math.ceil(_days.length / _daysPerPage);
  _page = Math.max(0, Math.min(totalPages-1, _page+d));
  renderPageNav(); renderGrid();
}

// ─── lane assignment (overlapping entries → fractional width) ─────────────────
// Assigns _lane and _totalLanes to each entry in the array so that overlapping
// entries within the same room column are rendered side-by-side at equal widths.
function assignLanes(entries) {
  entries.forEach(function(e){ e._lane=0; e._totalLanes=1; e._absStart=0; e._absEnd=0; });
  if(entries.length <= 1) return;

  // absolute minutes helper (handles midnight-crossing)
  function abs(e){
    var s=parseHHMM(e.start_time||'00:00');
    var en=parseHHMM(e.end_time||'01:00');
    if(en<=s) en+=1440;
    return {s:s,e:en};
  }

  // sort by start time for deterministic greedy assignment
  var sorted=entries.slice().sort(function(a,b){
    return parseHHMM(a.start_time||'00:00')-parseHHMM(b.start_time||'00:00');
  });

  // greedy lane assignment: place each entry in the first lane whose last
  // occupant ends before this entry starts.
  var laneEnds=[]; // absolute end time of the last entry assigned to each lane
  sorted.forEach(function(e){
    var t=abs(e);
    e._absStart=t.s; e._absEnd=t.e;
    var lane=-1;
    for(var i=0;i<laneEnds.length;i++){
      if(laneEnds[i]<=t.s){ lane=i; laneEnds[i]=t.e; break; }
    }
    if(lane===-1){ lane=laneEnds.length; laneEnds.push(t.e); }
    e._lane=lane;
  });

  // for each entry, count concurrent lanes = max _lane of any overlapping peer + 1
  sorted.forEach(function(e){
    var maxLane=0;
    sorted.forEach(function(o){
      if(o._absStart<e._absEnd && o._absEnd>e._absStart){
        if(o._lane>maxLane) maxLane=o._lane;
      }
    });
    e._totalLanes=maxLane+1;
  });
}

// ─── grid render ─────────────────────────────────────────────────────────────
function renderGrid(){
  var gridH = (_gridMax - _gridMin) * PX_PER_MIN;
  var el = document.getElementById('tt-editor-grid'); el.innerHTML='';

  // time axis
  var axis = document.createElement('div'); axis.className='tt-time-axis';
  var axisHdr = document.createElement('div'); axisHdr.className='tt-axis-header'; axis.appendChild(axisHdr);
  var axisBody = document.createElement('div'); axisBody.className='tt-axis-body'; axisBody.style.height=gridH+'px';
  // marks every 30 min
  for(var m=0; m<=_gridMax-_gridMin; m+=30){
    var rawMin = (_gridMin+m) % 1440;
    var line = document.createElement('div');
    line.className = 'tt-axis-line' + (m%60===0?'':' half');
    line.style.top = (m*PX_PER_MIN)+'px'; axisBody.appendChild(line);
    if(m%60===0){
      var lbl = document.createElement('div');
      lbl.className='tt-axis-mark'; lbl.style.top=(m*PX_PER_MIN)+'px';
      lbl.textContent = minToHHMM(rawMin); axisBody.appendChild(lbl);
    }
  }
  axis.appendChild(axisBody); el.appendChild(axis);

  // determine days to show for current page
  var startIdx = _page * _daysPerPage;
  var visibleDays = _days.slice(startIdx, startIdx + _daysPerPage);
  var roomList = _rooms.concat([{id:-1,label:'Other'}]); // -1=other sentinel

  visibleDays.forEach(function(day){
    var dayCol = document.createElement('div'); dayCol.className='tt-day-col';
    var dayHdr = document.createElement('div'); dayHdr.className='tt-day-header'; dayHdr.textContent=day; dayCol.appendChild(dayHdr);

    // Room-column headers row
    var roomsHdr = document.createElement('div'); roomsHdr.style.display='flex'; roomsHdr.style.position='sticky'; roomsHdr.style.top='32px'; roomsHdr.style.zIndex='3';
    roomList.forEach(function(r){
      var rh = document.createElement('div'); rh.className='tt-room-col-header'; rh.style.flex='1'; rh.title=r.label; rh.textContent=r.label; roomsHdr.appendChild(rh);
    });
    dayCol.appendChild(roomsHdr);

    // Room column bodies
    var roomsBody = document.createElement('div'); roomsBody.style.display='flex'; roomsBody.style.position='relative';

    roomList.forEach(function(r){
      var body = document.createElement('div'); body.className='tt-room-body'; body.style.height=gridH+'px'; body.style.flex='1'; body.style.position='relative';
      body.dataset.day=day; body.dataset.roomId=r.id!==null?String(r.id):''; body.dataset.roomLabel=r.label;

      // grid lines
      for(var m=0; m<=_gridMax-_gridMin; m+=30){
        var gl=document.createElement('div'); gl.className='tt-gridline '+(m%60===0?'hour':'half'); gl.style.top=(m*PX_PER_MIN)+'px'; body.appendChild(gl);
      }

      // entries for this day+room
      var colEntries = _entries.filter(function(e){
        var ed = effectiveDate(e);
        if(ed !== day) return false;
        if(r.id===-1){ // other column: no location_id and no room, or room not in _rooms list
          if(e.location_id) return !_rooms.some(function(rr){ return rr.id===e.location_id; });
          if(e.room) return !_rooms.some(function(rr){ return rr.label===e.room && rr.id===null; });
          return true;
        }
        if(r.id!==null) return e.location_id===r.id;
        return !e.location_id && e.room===r.label;
      });

      assignLanes(colEntries);
      colEntries.forEach(function(e){
        var tile = makeTile(e);
        if(e._totalLanes > 1){
          var pct = 100 / e._totalLanes;
          tile.style.left  = 'calc('+( e._lane    * pct)+'% + 2px)';
          tile.style.width = 'calc('+(              pct)+'% - 4px)';
          tile.style.right = 'auto';
        }
        body.appendChild(tile);
      });

      // drag-to-create new entry
      body.addEventListener('pointerdown', function(ev){
        if(ev.button!==0) return;
        if(ev.target!==body && !ev.target.classList.contains('tt-gridline')) return;
        startNewDrag(ev, body, day, r);
      });

      roomsBody.appendChild(body);
    });
    dayCol.appendChild(roomsBody);
    el.appendChild(dayCol);
  });
}

// ─── tile creation ────────────────────────────────────────────────────────────
function makeTile(e){
  var s = parseHHMM(e.start_time||'00:00');
  var en = parseHHMM(e.end_time||'01:00');
  if(en <= s) en += 1440;
  var sOff = absOffset(s);
  var eOff = absOffset(en > 1440+_gridMin ? _gridMax-_gridMin : Math.min(en,_gridMax)-_gridMin+(en>1440?1440:0));
  // simple: just clamp end to grid
  var startPx = sOff * PX_PER_MIN;
  var endAbsOff = en < _gridMin ? en+1440-_gridMin : en-_gridMin;
  if(endAbsOff > _gridMax-_gridMin) endAbsOff = _gridMax-_gridMin;
  var heightPx = Math.max(20, (endAbsOff - sOff) * PX_PER_MIN);

  var div = document.createElement('div');
  div.className = 'tt-panel';
  div.style.background = trackColor(e.entry_type||(_tracks[0]&&_tracks[0].slug));
  div.style.top = startPx+'px'; div.style.height=heightPx+'px';
  div.dataset.cid = e._cid;

  var titleEl=document.createElement('div'); titleEl.className='tt-panel-title'; titleEl.textContent=e.title||'(entry)'; div.appendChild(titleEl);
  if(e.musician_name||e.instructor_name){
    var sub=document.createElement('div'); sub.className='tt-panel-sub'; sub.textContent=e.musician_name||e.instructor_name||''; div.appendChild(sub);
  }
  var timeEl=document.createElement('div'); timeEl.className='tt-panel-time'; timeEl.textContent=(e.start_time||'')+'–'+(e.end_time||''); div.appendChild(timeEl);

  // resize handles
  var rhTop=document.createElement('div'); rhTop.className='tt-rh tt-rh-top'; div.appendChild(rhTop);
  var rhBot=document.createElement('div'); rhBot.className='tt-rh tt-rh-bot'; div.appendChild(rhBot);

  div.addEventListener('click', function(ev){
    if(_isDragging) return;
    ev.stopPropagation();
    openPopup(e);
  });

  setupMoveDrag(div, e);
  setupResizeDrag(rhTop, e, 'top');
  setupResizeDrag(rhBot, e, 'bot');

  return div;
}

// ─── drag: move tile (cross-room) ────────────────────────────────────────────
// Uses a fixed-position ghost + elementFromPoint so the tile can be dropped
// into any room column or day column visible on the current page.
function setupMoveDrag(tile, entry){
  tile.addEventListener('pointerdown', function(ev){
    if(ev.target.classList.contains('tt-rh')) return;
    if(ev.button!==0) return;
    ev.stopPropagation();

    var rect = tile.getBoundingClientRect();
    var startX = ev.clientX, startY = ev.clientY;
    var offsetY = ev.clientY - rect.top; // grab point within tile
    var ghost = null;
    var currentBody = null;
    var dragging = false;

    function onMove(e){
      if(!dragging){
        if(Math.abs(e.clientX-startX)<4 && Math.abs(e.clientY-startY)<4) return;
        dragging = true; _isDragging = true;
        // create floating ghost
        ghost = document.createElement('div');
        ghost.className = tile.className + ' tt-move-ghost';
        ghost.innerHTML = tile.innerHTML;
        ghost.style.width = rect.width+'px';
        ghost.style.height = rect.height+'px';
        document.body.appendChild(ghost);
        tile.style.opacity = '0.2';
      }
      ghost.style.left = (e.clientX - rect.width/2)+'px';
      ghost.style.top  = (e.clientY - offsetY)+'px';

      // hit-test the room body under the pointer (ghost is pointer-events:none)
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var body = el ? el.closest('.tt-room-body') : null;
      if(body !== currentBody){
        if(currentBody) currentBody.classList.remove('tt-drop-target');
        currentBody = body;
        if(currentBody) currentBody.classList.add('tt-drop-target');
      }
    }

    function onUp(e){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if(ghost){ document.body.removeChild(ghost); ghost=null; }
      tile.style.opacity = '';
      if(currentBody) currentBody.classList.remove('tt-drop-target');
      if(!dragging) return; // was a click, not a drag

      // fall back to original body if released outside any column
      var targetBody = currentBody || tile.closest('.tt-room-body');
      if(!targetBody){ setTimeout(function(){ _isDragging=false; },50); return; }

      // compute snapped time offset within target body
      var bodyRect = targetBody.getBoundingClientRect();
      var yInBody = e.clientY - bodyRect.top; // viewport-relative, accounts for scroll
      var snappedOff = Math.round(((yInBody - offsetY)/PX_PER_MIN)/SNAP)*SNAP;
      snappedOff = Math.max(0, Math.min(snappedOff, _gridMax - _gridMin - SNAP));

      // preserve original duration
      var sRaw = parseHHMM(entry.start_time||'00:00');
      var eRaw = parseHHMM(entry.end_time||'01:00');
      var dur = eRaw - sRaw; if(dur <= 0) dur += 1440;

      var newSMin = _gridMin + snappedOff;
      entry.start_time = minToHHMM(newSMin);
      entry.end_time   = minToHHMM(newSMin + dur);
      entry.entry_date = targetBody.dataset.day;

      // update room assignment from target column
      var rid = targetBody.dataset.roomId; // '' = free-text, '-1' = Other, else DB id
      if(rid === '-1'){
        entry.location_id=null; entry.location_name=''; entry.room='';
      } else if(rid !== ''){
        var ridInt = parseInt(rid);
        entry.location_id = ridInt;
        var rm = _rooms.find(function(r){ return r.id===ridInt; });
        entry.location_name = rm ? rm.label : (targetBody.dataset.roomLabel||'');
        entry.room = '';
      } else {
        entry.location_id=null; entry.location_name='';
        entry.room = targetBody.dataset.roomLabel||'';
      }

      _markDirty(); renderAll();
      setTimeout(function(){ _isDragging=false; },50);
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

// ─── drag: resize tile ────────────────────────────────────────────────────────
function setupResizeDrag(handle, entry, which){
  var startY, origTop, origH;
  handle.addEventListener('pointerdown', function(ev){
    ev.stopPropagation(); ev.preventDefault();
    if(ev.button!==0) return;
    startY = ev.clientY;
    var tile = handle.closest('.tt-panel');
    origTop = parseFloat(tile.style.top)||0;
    origH = parseFloat(tile.style.height)||40;
    handle.setPointerCapture(ev.pointerId);
    _isDragging = true;
  });
  handle.addEventListener('pointermove', function(ev){
    if(!ev.buttons || !_isDragging) return;
    var tile = handle.closest('.tt-panel');
    var dy = ev.clientY - startY;
    if(which==='bot'){
      var newH = Math.max(SNAP*PX_PER_MIN, origH+dy);
      var snapped = Math.round((newH/PX_PER_MIN)/SNAP)*SNAP*PX_PER_MIN;
      tile.style.height = snapped+'px';
    } else {
      var newTop = Math.max(0, origTop+dy);
      var snappedTop = Math.round((newTop/PX_PER_MIN)/SNAP)*SNAP*PX_PER_MIN;
      var newH2 = origH - (snappedTop - origTop);
      if(newH2 < SNAP*PX_PER_MIN) return;
      tile.style.top = snappedTop+'px'; tile.style.height = newH2+'px';
    }
  });
  handle.addEventListener('pointerup', function(ev){
    if(!_isDragging) return;
    _isDragging = false;
    var tile = handle.closest('.tt-panel');
    var top = parseFloat(tile.style.top)||0;
    var h = parseFloat(tile.style.height)||40;
    var startOff = Math.round((top/PX_PER_MIN)/SNAP)*SNAP;
    var endOff = Math.round(((top+h)/PX_PER_MIN)/SNAP)*SNAP;
    var sMin = _gridMin + startOff;
    var eMin = _gridMin + endOff;
    entry.start_time = minToHHMM(sMin);
    entry.end_time = minToHHMM(eMin);
    _markDirty(); renderAll();
    setTimeout(function(){ _isDragging=false; },50);
  });
}

// ─── drag: create new entry ───────────────────────────────────────────────────
function startNewDrag(ev, body, day, room){
  var rect = body.getBoundingClientRect();
  var startOff = Math.round(((ev.clientY - rect.top + body.scrollTop)/PX_PER_MIN)/SNAP)*SNAP;
  var ghost = document.createElement('div'); ghost.className='tt-ghost';
  ghost.style.top=(startOff*PX_PER_MIN)+'px'; ghost.style.height=(SNAP*PX_PER_MIN)+'px';
  body.appendChild(ghost);
  body.setPointerCapture(ev.pointerId);

  function onMove(e){
    var curOff = Math.round(((e.clientY - rect.top + body.scrollTop)/PX_PER_MIN)/SNAP)*SNAP;
    var top = Math.min(startOff,curOff)*PX_PER_MIN;
    var h = Math.abs(curOff-startOff)*PX_PER_MIN || SNAP*PX_PER_MIN;
    ghost.style.top=top+'px'; ghost.style.height=h+'px';
  }
  function onUp(e){
    body.removeEventListener('pointermove',onMove); body.removeEventListener('pointerup',onUp);
    var endOff = Math.round(((e.clientY - rect.top + body.scrollTop)/PX_PER_MIN)/SNAP)*SNAP;
    body.removeChild(ghost);
    var s = Math.min(startOff,endOff); var en = Math.max(startOff,endOff);
    if(en-s < SNAP) en = s+SNAP;
    var sMin = _gridMin + s; var eMin = _gridMin + en;
    // open popup with prefilled times
    var newE = {_cid:_nextCid(),entry_date:day,start_time:minToHHMM(sMin),end_time:minToHHMM(eMin),title:'',entry_type:'bal',location_id:room.id!==null&&room.id!==-1?room.id:null,location_name:room.id!==null&&room.id!==-1?room.label:'',room:room.id===null&&room.id!==-1?room.label:''};
    openPopup(newE, true);
  }
  body.addEventListener('pointermove',onMove); body.addEventListener('pointerup',onUp);
}

// ─── new entry button (#1226) ─────────────────────────────────────────────────
// Drag-to-create needs empty grid space to click on; this gives a way to add
// an entry that doesn't depend on that — defaults to the currently visible
// day, first room column, and the next free half-hour slot after the last
// entry in that room (or the top of the grid if it's empty).
function newEntry(){
  var day = _days[_page * _daysPerPage] || _days[0];
  var room = _rooms[0] || {id:-1,label:'Other'};
  var roomEntries = _entries.filter(function(e){
    if(effectiveDate(e) !== day) return false;
    if(room.id===-1) return !e.location_id && !e.room;
    return room.id!==null ? e.location_id===room.id : (!e.location_id && e.room===room.label);
  });
  var startMin = _gridMin;
  roomEntries.forEach(function(e){
    var en = parseHHMM(e.end_time||'00:00');
    var s = parseHHMM(e.start_time||'00:00');
    if(en<=s) en+=1440;
    var enAbs = en < _gridMin ? en+1440 : en;
    if(enAbs > startMin) startMin = enAbs;
  });
  startMin = Math.round(startMin/SNAP)*SNAP;
  var newE = {_cid:_nextCid(), entry_date:day, start_time:minToHHMM(startMin), end_time:minToHHMM(startMin+60), title:'', entry_type:(_tracks[0]&&_tracks[0].slug)||'bal',
    location_id: room.id!==null&&room.id!==-1?room.id:null, location_name: room.id!==null&&room.id!==-1?room.label:'', room: room.id===null&&room.id!==-1?room.label:''};
  openPopup(newE, true);
}

// ─── popup ────────────────────────────────────────────────────────────────────
function openPopup(entry, isNew){
  _popupEntry = entry; _popupIsNew = !!isNew;
  document.getElementById('tt-popup-title').textContent = isNew ? 'New entry' : 'Edit entry';
  // #1230: day is a real, editable field — not just whatever column the
  // entry happened to be created/cloned in. ppClone() in particular used to
  // leave the clone hardcoded to the source entry's day with no way to
  // retarget it, so "clone to the next day" silently cloned onto the same
  // day every time.
  var daySel = document.getElementById('pp-day'); daySel.innerHTML = '';
  var wantDay = entry.entry_date || (_days.length ? _days[0] : '');
  if(wantDay && _days.indexOf(wantDay) < 0) _days = _days.concat([wantDay]).sort();
  _days.forEach(function(d){
    var opt = document.createElement('option'); opt.value = d; opt.textContent = d;
    if(d === wantDay) opt.selected = true;
    daySel.appendChild(opt);
  });
  document.getElementById('pp-start').value = entry.start_time||'';
  document.getElementById('pp-end').value = entry.end_time||'';
  document.getElementById('pp-title').value = entry.title||'';
  var wantType = entry.entry_type||(_tracks[0]&&_tracks[0].slug)||'bal';
  ensureTrackOption(wantType);
  document.getElementById('pp-type').value = wantType;
  document.getElementById('pp-type-color').value = trackColor(document.getElementById('pp-type').value);
  document.getElementById('pp-desc').value = entry.description||'';
  document.getElementById('pp-mus-text').value = entry.musician_name||'';
  document.getElementById('pp-mus-id').value = entry.musician_id||'';
  document.getElementById('pp-ins-text').value = entry.instructor_name||'';
  document.getElementById('pp-ins-id').value = entry.instructor_id||'';
  // build room select
  var rSel = document.getElementById('pp-room-sel'); rSel.innerHTML='<option value="">— none —</option>';
  _rooms.forEach(function(r){
    var opt=document.createElement('option'); opt.value=r.id!==null?'id:'+r.id:'lbl:'+r.label; opt.textContent=r.label;
    if(entry.location_id && r.id===entry.location_id) opt.selected=true;
    else if(!entry.location_id && r.id===null && entry.room===r.label) opt.selected=true;
    rSel.appendChild(opt);
  });
  document.getElementById('pp-del-btn').hidden = isNew;
  document.getElementById('pp-clone-btn').hidden = isNew;
  document.getElementById('tt-popup').showModal();
}
var _popupIsNew = false;

function ppDirty(){}
function ppRoomSelChange(){}

// ─── track palette (#1174) ─────────────────────────────────────────────────
function trackColor(slug){
  var t = _tracks.find(function(tr){return tr.slug===slug;});
  return t ? colorToHex(t.color) : '#4a7fcb';
}
// <input type=color> only accepts #rrggbb; the default palette's colors are
// rgba(...) values, so translate those (only) to hex — a custom track's own
// color, added via the picker below, is already #rrggbb and passes through.
function colorToHex(c){
  var m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c||'');
  if(!m) return /^#[0-9a-fA-F]{6}$/.test(c||'') ? c : '#4a7fcb';
  function h(n){ return ('0'+parseInt(n,10).toString(16)).slice(-2); }
  return '#'+h(m[1])+h(m[2])+h(m[3]);
}
// ensureTrackOption guarantees the Type/Track <select> has an <option> for
// slug, adding one (using slug as its own display name, with a generic
// fallback color) if it's missing from _tracks/the select entirely. Without
// this, an entry whose entry_type isn't in the event's current track
// palette (legacy data, or a track that never made it into
// Event.TimetableTracks) would leave the <select> with no matching option:
// per the HTML spec, setting select.value to a value with no matching
// <option> sets selectedIndex to -1, and *reading* .value back then
// silently returns "" — so ppSave() would blank entry_type on save, and the
// entry would revert to the default track. Always called before setting
// pp-type's value in openPopup() so this can never happen.
function ensureTrackOption(slug){
  if(!slug) return;
  if(_tracks.some(function(t){return t.slug===slug;})) return;
  var track = {slug: slug, name: slug, color: '#4a7fcb'};
  _tracks.push(track);
  var opt = document.createElement('option');
  opt.value = track.slug; opt.textContent = track.name; opt.dataset.color = track.color;
  document.getElementById('pp-type').appendChild(opt);
}
function ppTypeChange(){
  document.getElementById('pp-type-color').value = trackColor(document.getElementById('pp-type').value);
  ppDirty();
}
function ppTypeColorChange(){
  var slug = document.getElementById('pp-type').value;
  var color = document.getElementById('pp-type-color').value;
  var t = _tracks.find(function(tr){return tr.slug===slug;});
  if(!t) return;
  t.color = color;
  var opt = document.querySelector('#pp-type option[value="'+slug+'"]');
  if(opt) opt.dataset.color = color;
  saveTracks();
  renderAll();
}
function slugify(name){
  var base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'track';
  var slug = base, n = 2;
  while(_tracks.some(function(t){return t.slug===slug;})){ slug = base+'-'+n; n++; }
  return slug;
}
function trackAddKeydown(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); addTrack(); }
}
function addTrack(){
  var nameInput = document.getElementById('tt-track-add-name');
  var colorInput = document.getElementById('tt-track-add-color');
  var name = nameInput.value.trim();
  if(!name) return;
  var track = {slug: slugify(name), name: name, color: colorInput.value};
  _tracks.push(track);
  var sel = document.getElementById('pp-type');
  var opt = document.createElement('option');
  opt.value = track.slug; opt.textContent = track.name; opt.dataset.color = track.color;
  sel.appendChild(opt);
  sel.value = track.slug;
  document.getElementById('pp-type-color').value = track.color;
  nameInput.value = '';
  saveTracks();
}
function saveTracks(){
  fetch('/admin/events/'+EVT_ID+'/timetable/tracks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(_tracks)})
    .catch(function(err){ console.error('saveTracks failed', err); });
}

function ppSave(){
  var e = _popupEntry;
  e.entry_date = document.getElementById('pp-day').value || e.entry_date;
  e.start_time = document.getElementById('pp-start').value;
  e.end_time = document.getElementById('pp-end').value;
  e.title = document.getElementById('pp-title').value.trim();
  e.entry_type = document.getElementById('pp-type').value;
  e.description = document.getElementById('pp-desc').value;
  var musId = document.getElementById('pp-mus-id').value;
  var musName = document.getElementById('pp-mus-text').value.trim();
  e.musician_id = musId ? parseInt(musId) : null; e.musician_name = musName;
  var insId = document.getElementById('pp-ins-id').value;
  var insName = document.getElementById('pp-ins-text').value.trim();
  e.instructor_id = insId ? parseInt(insId) : null; e.instructor_name = insName;
  // room
  var rSel = document.getElementById('pp-room-sel').value;
  e.location_id = null; e.location_name = ''; e.room = '';
  if(rSel.startsWith('id:')){
    var rid = parseInt(rSel.slice(3));
    var rr = _rooms.find(function(r){ return r.id===rid; });
    e.location_id = rid; e.location_name = rr ? rr.label : '';
  } else if(rSel.startsWith('lbl:')){
    e.room = rSel.slice(4);
  }
  if(!e.start_time || !e.end_time){ document.getElementById(e.start_time?'pp-end':'pp-start').focus(); return; }
  if(!e.title){ document.getElementById('pp-title').focus(); return; }
  if(_popupIsNew) _entries.push(e);
  document.getElementById('tt-popup').close();
  // Note: intentionally NOT calling recomputeTimeRange() here (#1226) — it
  // would re-tighten the grid to exactly wrap current entries, collapsing
  // away the empty space needed to drag-create the *next* entry outside
  // whatever window already exists. The grid's time range is fixed once at
  // init() from the event's own start/end and never narrows afterward;
  // growExtendRangeIfNeeded still widens it if an entry is placed near an edge.
  growTimeRangeIfNeeded(e);
  recomputeRooms(); _markDirty(); renderAll();
}
function ppCancel(){ document.getElementById('tt-popup').close(); }
// ppClone (#1227): duplicates the entry currently open in the popup — title,
// track, room, musician, instructor, description — onto the same day by
// default, but with start/end left blank. The admin must type the new time
// explicitly (ppSave's validation below rejects a blank start/end) rather
// than the clone guessing a slot, since same-shape repeats (meals being the
// main case) commonly land at a different time each day. The Day field
// openPopup() populates (#1230) is a real, editable dropdown, so cloning to
// a *different* day — e.g. "same meal, next day" — is just picking the
// other day there before saving, not a separate flow.
function ppClone(){
  var src = _popupEntry;
  var clone = {
    _cid: _nextCid(),
    entry_date: src.entry_date,
    start_time: '', end_time: '',
    title: document.getElementById('pp-title').value.trim(),
    entry_type: document.getElementById('pp-type').value,
    description: document.getElementById('pp-desc').value,
    location_id: src.location_id||null, location_name: src.location_name||'', room: src.room||'',
    musician_id: document.getElementById('pp-mus-id').value ? parseInt(document.getElementById('pp-mus-id').value) : null,
    musician_name: document.getElementById('pp-mus-text').value.trim(),
    instructor_id: document.getElementById('pp-ins-id').value ? parseInt(document.getElementById('pp-ins-id').value) : null,
    instructor_name: document.getElementById('pp-ins-text').value.trim()
  };
  document.getElementById('tt-popup').close();
  openPopup(clone, true);
}
function ppDelete(){
  var cid = _popupEntry._cid;
  _entries = _entries.filter(function(e){ return e._cid!==cid; });
  document.getElementById('tt-popup').close();
  recomputeRooms(); _markDirty(); renderAll();
}

// ─── autocomplete: musician ───────────────────────────────────────────────────
function ppMusOpen(){ ppMusRender(''); }
function ppMusInput(){
  document.getElementById('pp-mus-id').value='';
  ppMusRender(document.getElementById('pp-mus-text').value.trim());
}
function ppMusRender(q){
  var sug = document.getElementById('pp-mus-suggest');
  sug.innerHTML=''; sug.hidden=true;
  var hits = q ? _allMusicians.filter(function(m){ return m.name.toLowerCase().indexOf(q.toLowerCase())!==-1; }).slice(0,10) : _allMusicians.slice(0,20);
  hits.forEach(function(m){ sug.appendChild(acItem(m.name, function(){ ppMusPick(m); })); });
  if(q && !_allMusicians.some(function(m){ return m.name.toLowerCase()===q.toLowerCase(); })){
    var li=acItem('➕ '+q, function(){ ppMusCreate(q); }); li.className+=' tt-create'; sug.appendChild(li);
  }
  if(sug.children.length) sug.hidden=false;
}
function ppMusPick(m){ document.getElementById('pp-mus-text').value=m.name; document.getElementById('pp-mus-id').value=m.id; document.getElementById('pp-mus-suggest').hidden=true; }
function ppMusCreate(name){

  fetch('/admin/api/musician/quick-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bandname:name})})
    .then(function(r){return r.ok?r.json():Promise.reject();})

    .catch(function(){ alert('Could not create musician'); });
}
// ─── autocomplete: instructor ─────────────────────────────────────────────────
function ppInsOpen(){ ppInsRender(''); }
function ppInsInput(){

function ppInsRender(q){

  sug.innerHTML=''; sug.hidden=true;
  var hits = q ? _allInstructors.filter(function(i){ return i.name.toLowerCase().indexOf(q.toLowerCase())!==-1; }).slice(0,10) : _allInstructors.slice(0,20);

function acItem(text, fn){

// ─── save / delete ────────────────────────────────────────────────────────────
function saveTimetable(){
  var btn = document.getElementById('save-btn'); btn.disabled=true;
  var status = document.getElementById('save-status'); status.hidden=false; status.textContent='Saving…';
  var payload = _entries.map(function(e){
    return {start_time:e.start_time,end_time:e.end_time,title:e.title,description:e.description||'',room:e.room||'',entry_type:e.entry_type||'bal',entry_date:e.entry_date||'',location_id:e.location_id||null,musician_id:e.musician_id||null,instructor_id:e.instructor_id||null};
  });
  fetch('/admin/events/'+EVT_ID+'/timetable',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.ok?r.json():Promise.reject(r.statusText);})
    .then(function(){
      _formDirty=false; btn.disabled=false; status.textContent='Saved'; setTimeout(function(){ status.hidden=true; },2000);
    })
    .catch(function(err){ btn.disabled=false; status.textContent='Error: '+err; });
}

function syncEventTimes(){
  if(_entries.length===0){ alert('No timetable entries to sync from.'); return; }
  // Find min(entry_date + start_time) and max(entry_date + end_time) across all entries.
  var minDT=null, maxDT=null;
  _entries.forEach(function(e){
    var d=e.entry_date||'';
    if(!d) return;
    var s=d+'T'+(e.start_time||'00:00');
    var en=d+'T'+(e.end_time||'00:00');
    if(!minDT||s<minDT) minDT=s;
    if(!maxDT||en>maxDT) maxDT=en;
  });
  if(!minDT||!maxDT){ alert('Entries are missing dates — save the timetable first.'); return; }
  var msg='Set event times to:\nStart: '+minDT+'\nEnd:   '+maxDT+'\n\nContinue?';
  if(!confirm(msg)) return;
  var btn=document.getElementById('sync-btn');
  btn.disabled=true;
  fetch('/admin/events/'+EVT_ID+'/timetable/sync-times',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({start_time:minDT,end_time:maxDT})
  }).then(function(r){
    btn.disabled=false;
    if(r.ok){ alert('Event times updated.'); }
    else { r.text().then(function(t){ alert('Sync failed: '+t); }); }
  }).catch(function(err){ btn.disabled=false; alert('Error: '+err); });
}

function deleteTimetable(){
  if(!confirm('Delete entire timetable? This cannot be undone.')) return;
  fetch('/admin/events/'+EVT_ID+'/timetable',{method:'DELETE'})
    .then(function(r){
      if(r.ok||r.status===204){ _entries=[]; _cidCounter=1; _rooms=[]; _formDirty=false; recomputeTimeRange(); renderAll(); }
      else { alert('Delete failed: '+r.statusText); }
    })
    .catch(function(err){ alert('Error: '+err); });
}

// ─── dirty guard ─────────────────────────────────────────────────────────────
function _markDirty(){
  _formDirty=true;
  document.getElementById('save-btn').disabled=false;
}
function initDirtyGuard(){
  window.addEventListener('beforeunload',function(e){ if(!_formDirty) return; e.preventDefault(); e.returnValue=''; });
}

function safeGoBack(){
  if(!_formDirty){ doGoBack(); return; }
  var modal=document.getElementById('tt-nav-modal'); modal.showModal();
}
function doGoBack(){
  if(window.history.length>1) history.back(); else location.href='/admin/events/'+EVT_ID+'/edit';
}
function navModalClose(){ document.getElementById('tt-nav-modal').close(); }
function navModalDiscard(){ _formDirty=false; document.getElementById('tt-nav-modal').close(); doGoBack(); }
function navModalSaveGo(){
  document.getElementById('tt-nav-modal').close();
  var payload = _entries.map(function(e){
    return {start_time:e.start_time,end_time:e.end_time,title:e.title,description:e.description||'',room:e.room||'',entry_type:e.entry_type||'bal',entry_date:e.entry_date||'',location_id:e.location_id||null,musician_id:e.musician_id||null,instructor_id:e.instructor_id||null};
  });
  fetch('/admin/events/'+EVT_ID+'/timetable',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(){ _formDirty=false; doGoBack(); })
    .catch(function(err){ alert('Save failed: '+err); });
}
