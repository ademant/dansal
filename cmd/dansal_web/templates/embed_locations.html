<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Strings.T "embed_title_locations"}} — {{.SiteName}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:.9rem;color:#222;background:#fff}
#loc-map{height:100vh}
.loc-popup a{color:#1a6eb5;text-decoration:none;font-weight:500}
.loc-popup a:hover{text-decoration:underline}
.loc-popup .loc-town{color:#595959;font-size:.8rem;margin-top:.15rem}
.loc-popup .loc-count{color:#595959;font-size:.78rem;margin-top:.3rem}
.loc-legend{background:rgba(255,255,255,.88);padding:.35rem .55rem;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:.75rem;color:#555;line-height:1.6}
.loc-legend-dots{display:flex;align-items:center;gap:2px;margin-top:.15rem}
.loc-legend-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);flex-shrink:0}
.powered-by{text-align:right;padding:.25rem .5rem;font-size:.72rem;color:#595959}.powered-by a{color:#595959;text-decoration:none}.powered-by a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="loc-map"></div>
<script type="application/json" id="loc-data">{{.LocData}}</script>
<script nonce="{{$.Nonce}}" defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script nonce="{{$.Nonce}}" defer src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script nonce="{{$.Nonce}}">
(function(){
  var locData = JSON.parse(document.getElementById('loc-data').textContent);

  function escHtml(s){
    return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }

  // Color scale by future event count (relative to max in dataset)
  var maxFuture = locData.reduce(function(m,l){ return Math.max(m, l.future||0); }, 1);
  function pinColor(count){
    if(!count) return '#aaa';
    var frac = count / maxFuture;
    return frac <= 0.25 ? '#74b3f0'
         : frac <= 0.5  ? '#1a6eb5'
         : frac <= 0.75 ? '#f97316'
         :                '#dc2626';
  }

  function makeIcon(count){
    var c = pinColor(count);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41">'
      + '<path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="'+c+'" stroke="white" stroke-width="1.5"/>'
      + '<circle cx="12.5" cy="12.5" r="4.5" fill="white" opacity="0.55"/>'
      + '</svg>';
    return L.divIcon({
      className: '',
      html: svg,
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });
  }

  function dansalLeafletCss(){
    // #1215: load Leaflet CSS non-blocking (was a render-blocking <link> in
    // <head>); see base.html's helper for the comment and rationale.
    if(dansalLeafletCss.done) return;
    dansalLeafletCss.done=true;
    var sheets=[
      ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H'],
      ['https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css','sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+']
    ];
    sheets.forEach(function(s){
      var l=document.createElement('link');
      l.rel='stylesheet';l.href=s[0];l.integrity=s[1];l.crossOrigin='anonymous';l.media='print';
      l.onload=function(){l.media='all';};
      document.head.appendChild(l);
    });
  }

  function reportHeight(){window.parent.postMessage({type:'dansal-embed-height',height:document.body.scrollHeight},'*')}

  window.addEventListener('load',function(){
    dansalLeafletCss();
    var map = L.map('loc-map',{scrollWheelZoom:false}).setView([50,10],5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom:18
    }).addTo(map);

    var cluster = L.markerClusterGroup({maxClusterRadius:40});

    locData.forEach(function(l){
      var popup = '<div class="loc-popup">'
        + '<a href="{{.BaseURL}}/location/'+l.id+'" target="_blank" rel="noopener">'+escHtml(l.name)+'</a>';
      if(l.town){ popup += '<div class="loc-town">'+escHtml(l.town)+'</div>'; }
      if(l.future > 0){ popup += '<div class="loc-count">'+escHtml("{{.Strings.T "embed_loc_upcoming_events"}}".replace('%d', l.future))+'</div>'; }
      popup += '</div>';
      // title gives the marker's <div role="button"> an accessible name
      // (axe-core's aria-command-name rule) — Leaflet's divIcon marker is
      // otherwise unlabelled for screen readers.
      L.marker([l.lat,l.lng], {icon: makeIcon(l.future), title: l.name}).bindPopup(popup).addTo(cluster);
    });

    map.addLayer(cluster);
    if(locData.length) map.fitBounds(cluster.getBounds(),{padding:[20,20],maxZoom:9});

    var legend = L.control({position:'bottomright'});
    legend.onAdd = function(){
      var div = L.DomUtil.create('div','loc-legend');
      var colors = ['#aaa','#74b3f0','#1a6eb5','#f97316','#dc2626'];
      var dots = colors.map(function(c){
        return '<div class="loc-legend-dot" style="background:'+c+'"></div>';
      }).join('');
      div.innerHTML = '<div class="loc-legend-dots"><span>0</span>'+dots+'<span>'+maxFuture+'</span></div>';
      return div;
    };
    legend.addTo(map);
    reportHeight();
  });
  new ResizeObserver(reportHeight).observe(document.body);
})();
</script>
<div class="powered-by"><a href="{{.BaseURL}}" target="_blank" rel="noopener">Powered by {{.SiteName}}</a></div>
</body>
</html>
