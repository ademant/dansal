<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Strings.T "embed_title_next"}} — {{.SiteName}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:.85rem;color:#222;background:#fff;padding:.5rem 0}
ul{list-style:none}
li{display:flex;gap:.5rem;padding:.35rem 0;border-bottom:1px solid #f0f0f0;align-items:baseline}
li:last-child{border-bottom:none}
.d{min-width:5.5rem;font-weight:600;color:#1a6eb5;white-space:nowrap;font-size:.8rem;flex-shrink:0}
.t a{color:#222;text-decoration:none}
.t a:hover{color:#1a6eb5;text-decoration:underline}
.loc{display:block;color:#595959;font-size:.75rem}
.empty{color:#aaa;padding:.5rem 0}
.powered-by{text-align:right;padding:.25rem .5rem;font-size:.72rem;color:#595959}.powered-by a{color:#595959;text-decoration:none}.powered-by a:hover{text-decoration:underline}
</style>
</head>
<body>
{{if .Events}}
<ul>
{{range .Events}}
<li>
  <span class="d">{{formatDate $.Lang .StartTime}}</span>
  <span class="t">
    <a href="{{$.BaseURL}}/events/{{.ID}}" target="_blank" rel="noopener">{{.Title}}</a>
    {{if .Location}}<span class="loc">{{.Location.Location}}</span>{{end}}
  </span>
</li>
{{end}}
</ul>
{{else}}
<span class="empty">—</span>
{{end}}
<script nonce="{{$.Nonce}}">
  function reportHeight(){window.parent.postMessage({type:'dansal-embed-height',height:document.body.scrollHeight},'*')}
  window.addEventListener('load',reportHeight);
  new ResizeObserver(reportHeight).observe(document.body);
</script>
<div class="powered-by"><a href="{{.BaseURL}}" target="_blank" rel="noopener">Powered by {{.SiteName}}</a></div>
</body>
</html>
