{{template "base" .}}
{{define "content"}}
<div class="error-page-wrap">
  {{with .Data}}
  <h1 class="error-page-title">{{.Title}}</h1>
  <p class="error-page-message">{{.Message}}</p>
  <a href="/" class="error-page-home">{{.BackHome}}</a>
  {{end}}
</div>

<style>
.error-page-wrap{max-width:480px;margin:4rem auto;text-align:center}
.error-page-title{font-size:1.6rem;margin-bottom:.75rem}
.error-page-message{color:var(--fg-muted);margin-bottom:1.5rem}
.error-page-home{display:inline-block;padding:.5rem 1.2rem;border-radius:4px;background:var(--link);color:#fff;font-weight:600;text-decoration:none}
.error-page-home:hover{background:var(--link-h)}
</style>
{{end}}
