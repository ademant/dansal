{{template "base" .}}
{{define "content"}}
<div class="suggest-wrap">
  <h1>{{.Strings.T "register_title"}}</h1>

  {{with .Data}}
  {{if .Error}}<p class="form-error" role="alert">{{$.Strings.T .Error}}</p>{{end}}

  <div class="tab-bar" style="margin-bottom:1.25rem">
    <button type="button" class="tab-btn active" onclick="switchTab('join')">{{$.Strings.T "register_tab_join"}}</button>
    <button type="button" class="tab-btn" onclick="switchTab('new')">{{$.Strings.T "register_tab_new"}}</button>
  </div>

  <form method="post" action="/register">
    <input type="hidden" name="_form_ts" value="{{.FormToken}}">
    <input type="text" name="phone2" class="hp-field" style="display:none!important" tabindex="-1" autocomplete="off">

    <div id="tab-join" class="reg-tab">
      <input type="hidden" name="reg_type" value="join_org" form="reg-join-hidden">
    </div>
    <div id="tab-new" class="reg-tab" hidden>
      <input type="hidden" name="reg_type" value="new_org" form="reg-new-hidden">
    </div>

    <input type="hidden" id="field-reg-type" name="reg_type" value="join_org">

    <div class="form-group">
      <label for="field-email">{{$.Strings.T "register_email"}}</label>
      <input type="email" id="field-email" name="email" required autocomplete="email" class="form-input">
      <p class="form-hint">{{$.Strings.T "register_email_hint"}}</p>
    </div>

    {{/* join_org fields */}}
    <div id="join-fields">
      <div class="form-group">
        <label for="field-org-id">{{$.Strings.T "register_org"}}</label>
        <select id="field-org-id" name="org_id" class="form-input">
          <option value="">—</option>
          {{range .Orgs}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
        </select>
      </div>
    </div>

    {{/* new_org fields */}}
    <div id="new-fields" hidden>
      <div class="form-group">
        <label for="field-org-name">{{$.Strings.T "register_org_name"}}</label>
        <input type="text" id="field-org-name" name="org_name" class="form-input">
      </div>
      <div class="form-group">
        <label for="field-org-desc">{{$.Strings.T "register_org_desc"}}</label>
        <textarea id="field-org-desc" name="org_description" class="form-input" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="field-org-website">{{$.Strings.T "register_org_website"}}</label>
        <input type="url" id="field-org-website" name="org_website" class="form-input">
      </div>
      <div class="form-group">
        <label for="field-org-email">{{$.Strings.T "register_org_email"}}</label>
        <input type="email" id="field-org-email" name="org_contact_email" class="form-input">
      </div>
    </div>

    {{/* Verification channel */}}
    <div class="form-group">
      <label>{{$.Strings.T "register_channel"}}</label>
      <div class="radio-group">
        <label><input type="radio" name="channel" value="email" checked onchange="updateChannelFields()"> {{$.Strings.T "register_email"}}</label>
        <label><input type="radio" name="channel" value="telegram" onchange="updateChannelFields()"> Telegram</label>
      </div>
    </div>
    <div id="telegram-field" hidden class="form-group">
      <label for="field-telegram">{{$.Strings.T "register_telegram"}}</label>
      <input type="text" id="field-telegram" name="telegram" autocomplete="off" class="form-input">
    </div>

    <button type="submit" class="btn-primary">{{$.Strings.T "register_submit"}}</button>
  </form>
  {{end}}
</div>
<style>
.suggest-wrap{max-width:540px;margin:2rem auto}
.tab-bar{display:flex;gap:.5rem;border-bottom:2px solid var(--border);padding-bottom:.5rem}
.tab-btn{background:var(--btn-bg);border:1px solid var(--border);border-radius:4px 4px 0 0;padding:.4rem .9rem;cursor:pointer;color:var(--fg);font-size:.92rem}
.tab-btn.active{background:var(--bg-hover);border-bottom-color:transparent;font-weight:600;color:var(--heading)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.9rem;color:var(--fg-dim)}
.form-input{width:100%;padding:.45rem .6rem;border:1px solid var(--border-mid);border-radius:4px;background:var(--bg-card);color:var(--fg);font-size:.95rem}
.radio-group{display:flex;gap:1.25rem}
.radio-group label{font-weight:normal;color:var(--fg)}
.btn-primary{background:#1a6eb5;color:#fff;border:none;border-radius:4px;padding:.5rem 1.25rem;font-size:1rem;cursor:pointer;margin-top:.5rem}
.btn-primary:hover{background:#0d4a80}
.form-error{background:var(--badge-danger-bg);color:var(--badge-danger-fg);border-radius:4px;padding:.6rem .9rem;margin-bottom:1rem}
.form-hint{font-size:.82rem;color:var(--fg-muted);margin:.2rem 0 0}
.hp-field{display:none!important}
</style>
<script>
function switchTab(tab) {
  document.getElementById('tab-join').hidden = tab !== 'join';
  document.getElementById('tab-new').hidden = tab !== 'new';
  document.getElementById('join-fields').hidden = tab !== 'join';
  document.getElementById('new-fields').hidden = tab !== 'new';
  document.getElementById('field-reg-type').value = tab === 'join' ? 'join_org' : 'new_org';
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active', (i===0&&tab==='join')||(i===1&&tab==='new'));});
}
function updateChannelFields() {
  var tg = document.querySelector('input[name="channel"]:checked').value === 'telegram';
  document.getElementById('telegram-field').hidden = !tg;
}
</script>
{{end}}
