{{template "base" .}}
{{define "content"}}
<div class="suggest-wrap">
  <h1>{{.Strings.T "register_verified_title"}}</h1>
  {{if .Data}}
  <p>{{.Strings.T "register_verified_ok"}}</p>
  {{else}}
  <p class="form-error">{{.Strings.T "register_verified_fail"}}</p>
  {{end}}
  <p style="margin-top:1.5rem"><a href="/">{{.Strings.T "register_done_back"}}</a></p>
</div>
<style>
.suggest-wrap{max-width:540px;margin:2rem auto}
.form-error{background:var(--badge-danger-bg);color:var(--badge-danger-fg);border-radius:4px;padding:.6rem .9rem;margin-bottom:1rem}
</style>
{{end}}
