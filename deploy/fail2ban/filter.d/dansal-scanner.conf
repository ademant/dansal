[Definition]
# Requests for paths no dansal vhost serves: dotfiles (.env, .git, .aws, also
# with %2e for the dot) and WordPress (wp-*, xmlrpc.php). Any status counts:
# dansal answers these with a redirect or 404, but each probe is one more
# scanner request to rule out (#1878).
#
# Reads the nginx access log written with the dansal_main format
# (deploy/nginx/dansal-log-formats.conf), which starts with
#   <remote_addr> - [<time>] "<method> <path> ...
failregex = ^<HOST> - \[[^\]]*\] "[A-Z]+ /(?:[^ ?]*/)?(?:\.|%2[eE])(?:env|git|aws)(?:[^a-zA-Z0-9-]|$)
            ^<HOST> - \[[^\]]*\] "[A-Z]+ /(?:[^ ?]*/)?wp-(?:admin|content|includes|login|config|json|cron|signup|trackback)(?:[^a-zA-Z0-9-]|$)
            ^<HOST> - \[[^\]]*\] "[A-Z]+ /(?:[^ ?]*/)?xmlrpc\.php(?:[^a-zA-Z0-9-]|$)
ignoreregex =
