# Scanner probes on a dansal vhost (#1878). dansal has no WordPress and serves
# no dotfiles, so a request for .env*, .git/ or wp-* at any directory depth is
# always a probe. Matches any status: prod answers /admin/.env with 303 (login
# redirect), the rest with 404/301.
#
# Log format dansal_main (deploy/nginx/dansal-log-formats.conf):
#   $remote_addr - [$time_local] "$request" $status ...
# fail2ban strips the matched date, leaving "[]".

[Definition]
failregex = ^<ADDR> - \[\] "[A-Z]+ /(?:[^" ]*/)?(?i:(?:\.|%%2e)env[^/" ]*|(?:\.|%%2e)git/|wp-(?:admin|content|includes|login|config|json|cron|signup|trackback))[^" ]* HTTP/
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
