[INCLUDES]
before = common.conf

[Definition]
# AUTH_BLOCK: IP already throttled by in-process limiter; apply network ban on top.
# AUTH_FAIL:  individual failed login attempt (wrong credentials).
# PUBLIC_BLOCK: rate-limited public form endpoint (suggest, contact board, booking).
# TOKEN_BLOCK: GET-side token-issuance rate limit hit (page-load for form pages).
# HONEYPOT: bot filled a hidden field — strong signal, ban immediately.
failregex = dansal-web: AUTH_BLOCK ip=<HOST>( |$)
            dansal-web: AUTH_FAIL ip=<HOST>( |$)
            dansal-web: PUBLIC_BLOCK ip=<HOST>( |$)
            dansal-web: TOKEN_BLOCK ip=<HOST>( |$)
            dansal-web: HONEYPOT ip=<HOST>( |$)
ignoreregex =
