[INCLUDES]
before = common.conf

[Definition]
# Matches both the in-process AUTH_BLOCK log (already throttled) and individual
# failed login attempts, so fail2ban can enforce a network-level ban on top of
# the application throttle.
failregex = dansal-web: AUTH_BLOCK ip=<HOST>( |$)
            login failed from <HOST>:
ignoreregex =
