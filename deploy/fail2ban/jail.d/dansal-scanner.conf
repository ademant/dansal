# One jail per instance; deploy-fail2ban templates the domain into logpath and
# writes /etc/fail2ban/jail.d/dansal-scanner-<instance>.conf (#1878).
[dansal-scanner]
enabled  = true
filter   = dansal-scanner
backend  = auto
logpath  = /var/log/nginx/events.example.com.access.log
# Three probes in ten minutes is enough: a real visitor never requests these
# paths. Banned for a day, because scanner networks rotate addresses daily.
maxretry = 3
findtime = 600
bantime  = 86400
# Loopback and this server's own addresses are never banned. deploy-fail2ban
# replaces __SERVER_IPS__ with the host's addresses.
ignoreip = 127.0.0.1/8 ::1 __SERVER_IPS__
