# Ban scanners probing .env / .git / wp- paths (#1878). Template: deploy-fail2ban
# renames the section to [dansal-scanner-<instance>] and fills in the
# instance's access log from web.yaml's domain.
#
# 3 probes in 10 minutes is far beyond any real visitor (they never request
# these paths) while a scanner sends ~200 in a burst. Cloud scanner IPs rotate
# about daily, so a 1-day ban is enough.

[dansal-scanner]
enabled  = true
filter   = dansal-scanner
logpath  = /var/log/nginx/events.example.com.access.log
port     = http,https
maxretry = 3
findtime = 600
bantime  = 86400
# Never ban loopback or the server itself (wp-dansal sync, health checks).
ignoreip = 127.0.0.1/8 ::1
