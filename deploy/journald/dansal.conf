# Host-wide journald retention for dansal services (#1481, compliance G7:
# COMPLIANCE_AUDIT.md §3.5). All dansal/dansal-web/dansal-webmin/dansal-doc
# units log to journald only (SyslogIdentifier, no app log files -- see
# systemd/*.service) and are not namespaced, so retention is journald's,
# not something a per-instance config can scope. This is a single shared
# drop-in installed once by `make setup-instance`, unlike the per-instance
# nginx/logrotate/fail2ban templates that substitute a domain or unit name.
#
# 30 days / 1GB matches the default documented in the privacy-notice
# guidance (G1) -- change both together if you adjust this.
[Journal]
MaxRetentionSec=30day
SystemMaxUse=1G
