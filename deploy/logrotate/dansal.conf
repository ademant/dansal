# nginx access/error/feed logs for one dansal instance (#1481, compliance
# G7: COMPLIANCE_AUDIT.md §3.5). deploy/nginx/dansal.conf names these files
# after the instance's domain rather than a generic dansal-*.log, so
# whether the distro's own /etc/logrotate.d/nginx already globs
# /var/log/nginx/*.log (most do) and happens to cover them is not
# guaranteed -- see the note in deploy/nginx/README.md. This stanza makes
# retention explicit and instance-scoped instead of relying on that.
#
# Templated by `make deploy-logrotate INSTANCE=<name>`: events.example.com
# is substituted for the real domain, the same placeholder convention
# deploy-nginx already uses for deploy/nginx/dansal.conf.
#
# 30 days matches the default documented in the privacy-notice guidance
# (G1) -- change both together if you adjust this.
/var/log/nginx/events.example.com.access.log
/var/log/nginx/events.example.com.error.log
/var/log/nginx/events.example.com-feed.log
{
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    # No explicit owner/group: nginx's user differs across the distros this
    # project supports (www-data on Debian/Ubuntu, nginx on CentOS/RHEL) --
    # logrotate's `create` with no user/group keeps the rotated file's
    # existing ownership.
    create 0640
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 `cat /run/nginx.pid`
    endscript
}
