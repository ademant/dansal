# Global catch-all server block, rejecting requests with an unrecognized
# Host header (or direct-IP connections) instead of falling through to the
# first configured per-instance server block.
#
# This file is installed once, independent of any instance, via:
#   sudo make deploy-nginx-default
#
# It must NOT be part of deploy/nginx/dansal.conf: that template is
# regenerated per instance by `deploy-nginx INSTANCE=<name>`, and nginx
# allows only one `default_server` per listen address/port — a second
# instance's deploy would fail `nginx -t`.
#
# If your nginx is older than 1.19.4 (no ssl_reject_handshake), replace the
# TLS server block below with one that uses a self-signed "snakeoil"
# certificate and `return 444;`.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Uncomment if HTTP/3 (QUIC) is enabled on this host:
# server {
#     listen 443 quic default_server;
#     listen [::]:443 quic default_server;
#     server_name _;
#     ssl_reject_handshake on;
# }
