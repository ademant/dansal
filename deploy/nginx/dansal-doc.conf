# nginx reverse proxy for dansal-doc
#
# dansal-doc listens on 127.0.0.1:8070 and serves Markdown documentation,
# typically from the packaged GitHub wiki mirror at /usr/share/dansal/wiki.
#
# Replace doc.example.com with your actual documentation subdomain.

upstream dansal_doc {
    server 127.0.0.1:8070;
    keepalive 8;
}

# Connection limiting zone: caps concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=doc_conn_limit:10m;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doc.example.com;

    ssl_certificate     /etc/letsencrypt/live/doc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doc.example.com/privkey.pem;
    ssl_session_cache   shared:SSL_doc:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header X-Frame-Options            SAMEORIGIN                            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy         "geolocation=(self), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                         always;

    location / {
        limit_conn doc_conn_limit 20;

        proxy_pass         http://dansal_doc;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
