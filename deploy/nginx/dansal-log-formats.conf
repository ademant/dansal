# Shared http{}-scope directives for all dansal instances -- log formats and
# gzip settings.
#
# Directives like log_format and gzip are global to the whole http{} context
# -- declaring the same one twice (even with identical content) across two
# files under conf.d/ is a fatal "directive is duplicate" error. Each
# instance's dansal-<instance>.conf (deploy/nginx/dansal.conf, templated by
# `make deploy-nginx INSTANCE=<name>`) references the log formats by name and
# relies on gzip being on, but must NOT redeclare either -- this file is
# installed once, filename-prefixed so it's included (and parsed) before any
# dansal-<instance>.conf that depends on it (see #1117, #1132).

# Per-instance log format: unlike nginx.conf's shared "main" format, this
# includes $remote_addr and $host so lines can be attributed to a source IP
# and a vhost without guessing from Referer/UA. request_time/
# upstream_response_time (see #1121) are the only way to measure real
# server-side latency today -- upstream_response_time is "-" for requests
# nginx serves itself (e.g. the HTTP->HTTPS redirect), which is expected.
log_format dansal_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" host=$host '
                        'rt=$request_time urt=$upstream_response_time';

# Anonymized log format for the /feed/ endpoints (iCal/RSS/JSON subscriptions):
# no $remote_addr, just enough to gauge how often feeds are actually polled
# before investing in e.g. raising the per-event cap past the index page's
# pagination limit (see #650/#651).
log_format feed_anon '$time_local "$request" $status $body_bytes_sent "$http_user_agent"';

# Compress responses before they go out to visitors -- both dansal-web's
# HTML pages and the API's JSON went out uncompressed (nginx's own gzip was
# never turned on; dansal-web has no gzip middleware of its own, unlike the
# API's, which only covers /api/). Measured: the homepage is ~235KB
# uncompressed, ~36KB gzipped (see #1121). text/html is compressed by
# default and doesn't need to be listed in gzip_types.
#
# gzip_proxied must be "any": nginx's default (off) skips compression for
# proxied responses, and every response here comes from proxy_pass to
# dansal_web/dansal_api -- without this, none of the below does anything.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;
