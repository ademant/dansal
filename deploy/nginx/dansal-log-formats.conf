# Shared log_format definitions for all dansal instances.
#
# nginx's log_format directive is global to the whole http{} context --
# defining the same name twice (even with identical content) across two
# files under conf.d/ is a fatal "duplicate log_format name" error. Each
# instance's dansal-<instance>.conf (deploy/nginx/dansal.conf, templated by
# `make deploy-nginx INSTANCE=<name>`) references these formats by name but
# must NOT redeclare them -- this file is installed once, filename-prefixed
# so it's included (and its log_format directives parsed) before any
# dansal-<instance>.conf that references them (see #1117).

# Per-instance log format: unlike nginx.conf's shared "main" format, this
# includes $remote_addr and $host so lines can be attributed to a source IP
# and a vhost without guessing from Referer/UA.
log_format dansal_main '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" host=$host';

# Anonymized log format for the /feed/ endpoints (iCal/RSS/JSON subscriptions):
# no $remote_addr, just enough to gauge how often feeds are actually polled
# before investing in e.g. raising the per-event cap past the index page's
# pagination limit (see #650/#651).
log_format feed_anon '$time_local "$request" $status $body_bytes_sent "$http_user_agent"';
