# nginx reverse proxy for dansal-webmin with mandatory mTLS
#
# dansal-webmin listens on 127.0.0.1:8090
#
# ssl_verify_client on — every request MUST present a valid client certificate
# issued by the dansal mTLS CA. Generate the CA and client certs with:
#
#   dansal_admin mtls-init
#   dansal_admin mtls-issue --username alice
#
# The CA certificate is stored at /etc/dansal/mtls/ca.crt.
# Import the PKCS#12 bundle printed by mtls-issue into your browser.
#
# Since this config already rejects any request without a verified client
# certificate (ssl_verify_client on), set `cert_only: true` in webmin.yaml
# to also disable webmin's password-login fallback (#994) — every request
# reaching dansal-webmin is already guaranteed to carry a verified cert.
#
# Replace webmin.example.com with your actual webmin subdomain.

upstream dansal_webmin {
    server 127.0.0.1:8090;
    keepalive 8;
}

# Connection limiting zone: caps concurrent connections per IP, mitigating
# slow-loris-style attacks.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webmin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmin.example.com;

    ssl_certificate     /etc/letsencrypt/live/webmin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmin.example.com/privkey.pem;
    ssl_session_cache   shared:SSL_webmin:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Connection/request timeouts (mitigate slow-loris-style attacks)
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # mTLS: require a valid client certificate from the dansal CA.
    # Run 'dansal_admin mtls-init' to create /etc/dansal/mtls/ca.crt.
    ssl_verify_client       on;
    ssl_client_certificate  /etc/dansal/mtls/ca.crt;
    ssl_verify_depth        2;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           DENY                                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Cache-Control             "no-store"                            always;
    add_header Permissions-Policy            "geolocation=(self), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
    add_header Cross-Origin-Resource-Policy  "same-origin"                      always;

    location / {
        limit_conn conn_limit 20;

        proxy_pass         http://dansal_webmin;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward mTLS client certificate info to dansal-webmin.
        # Used by the mTLS auth layer (#363) to auto-authenticate known certs.
        proxy_set_header   X-Client-Verified $ssl_client_verify;
        proxy_set_header   X-Client-DN       $ssl_client_s_dn;

        client_max_body_size 2m;
    }
}
