# nginx reverse proxy for dansal + dansal-web with HTTP/3 support
#
# dansal REST API  listens on 127.0.0.1:8000
# dansal-web       listens on 127.0.0.1:8080
#
# Both are exposed on the same domain with HTTP/2 + HTTP/3 (QUIC):
#   https://events.example.com/         → web frontend (HTML + ActivityPub)
#   https://events.example.com/api/     → REST API
#
# Replace events.example.com with your actual domain and adjust the
# TLS certificate paths (certbot / Let's Encrypt recommended).
#
# HTTP/3 Requirements:
# - nginx 1.25.0+ compiled with --with-http_v3_module
# - Linux kernel 5.6+ for QUIC support
# - OpenSSL 1.1.1+ for TLS 1.3

upstream dansal_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream dansal_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name events.example.com;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 + HTTP/3 (QUIC) support
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    # HTTP/3 settings
    quic_retry on;

    server_name events.example.com;

    # Enhanced TLS configuration for HTTP/3
    ssl_certificate     /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve      X25519:prime256v1;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_early_data      on;  # Important for HTTP/3 0-RTT

    # Security headers with HTTP/3 advertisement
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400';  # Advertise HTTP/3 support
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # REST API — proxied by path prefix
    location /api/ {
        proxy_pass         http://dansal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Web frontend — everything else (HTML pages + ActivityPub endpoints)
    location / {
        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

