# nginx reverse proxy for dansal + dansal-web with HTTP/3 support
#
# dansal REST API  listens on 127.0.0.1:8000
# dansal-web       listens on 127.0.0.1:8080
#
# Both are exposed on the same domain:
#   https://events.example.com/         → web frontend (HTML + ActivityPub)
#   https://events.example.com/api/     → REST API
#
# Replace events.example.com with your actual domain and adjust the
# TLS certificate paths (certbot / Let's Encrypt recommended).
#
# HTTP/3 (QUIC) Requirements:
#   - nginx 1.25.0+ with --with-http_v3_module
#   - OpenSSL 1.1.1+ (for QUIC support)
#   - Kernel 5.6+ (for UDP GRO support, recommended for better performance)
#
# Rate Limiting Configuration:
#   - API: 10 requests/second per IP with burst of 20
#   - Auth endpoints: 5 requests/second per IP with burst of 10
#   - Adjust based on your traffic patterns and security requirements
#
# After deploying, test with:
#   curl --http3-only https://events.example.com

upstream dansal_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream dansal_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Rate limiting zones (shared memory for tracking request rates)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name events.example.com;
    return 301 https://$host$request_uri;
}

# HTTP/3 (QUIC) server
server {
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name events.example.com;

    ssl_certificate     /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.3;  # HTTP/3 requires TLSv1.3
    ssl_prefer_server_ciphers off;

    # HTTP/3 specific settings
    quic_retry on;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # REST API — proxied by path prefix
    location /api/ {
        # Apply rate limiting: 10 requests/second with burst of 20
        limit_req zone=api_limit burst=20 nodelay;
        
        # Special rate limiting for auth endpoints
        if ($request_uri ~* "/api/v1/(login|register|verify|invites)") {
            limit_req zone=auth_limit burst=10 nodelay;
        }
        
        proxy_pass         http://dansal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        
        # Return 429 status code instead of default 503 when rate limited
        limit_req_status 429;
    }

    # Web frontend — everything else (HTML pages + ActivityPub endpoints)
    location / {
        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

# HTTP/2 + HTTP/1.1 fallback server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name events.example.com;

    ssl_certificate     /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # REST API — proxied by path prefix
    location /api/ {
        # Apply rate limiting: 10 requests/second with burst of 20
        limit_req zone=api_limit burst=20 nodelay;
        
        # Special rate limiting for auth endpoints
        if ($request_uri ~* "/api/v1/(login|register|verify|invites)") {
            limit_req zone=auth_limit burst=10 nodelay;
        }
        
        proxy_pass         http://dansal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        
        # Return 429 status code instead of default 503 when rate limited
        limit_req_status 429;
    }

    # Web frontend — everything else (HTML pages + ActivityPub endpoints)
    location / {
        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

