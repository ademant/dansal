# nginx reverse proxy for dansal + dansal-web with HTTP/3 support
#
# dansal REST API  listens on 127.0.0.1:8000
# dansal-web       listens on 127.0.0.1:8080
#
# Both are exposed on the same domain:
#   https://events.example.com/         → web frontend (HTML + ActivityPub)
#   https://events.example.com/api/     → REST API
#
# Replace events.example.com with your actual domain and adjust the
# TLS certificate paths (certbot / Let's Encrypt recommended).
#
# HTTP/3 (QUIC) Requirements:
#   - nginx 1.25.0+ with --with-http_v3_module (minimum for HTTP/3)
#   - OpenSSL 1.1.1+ or OpenSSL 3.0+ (for QUIC support)
#   - Kernel 5.6+ (for UDP GRO support, recommended for better performance)
#
# HTTP/2 Only Requirements:
#   - nginx 1.9.5+ (for HTTP/2 support without HTTP/3)
#   - Comment out the HTTP/3 server block if not using HTTP/3
#
# Rate Limiting Requirements:
#   - nginx 1.1.10+ with --with-http_limit_req_module (included in most builds)
#
# Rate Limiting Configuration:
#   - API: 10 requests/second per IP with burst of 20
#   - Auth endpoints: 5 requests/second per IP with burst of 10
#   - Adjust based on your traffic patterns and security requirements
#
# After deploying, test with:
#   curl --http3-only https://events.example.com

upstream dansal_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream dansal_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Rate limiting zones (shared memory for tracking request rates)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Connection limiting zone: caps concurrent connections per IP, mitigating
# slow-loris-style attacks that limit_req's rate-based limiting doesn't catch.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Aggressive-crawler throttle: known bots that ignore robots.txt crawl-delay
# and replay stale/malformed URLs indefinitely (e.g. Amazonbot working
# through a backlog of pre-#1089 ?lang=X?lang=Y hreflang chains) get slowed
# to 2 req/min instead of hitting the web frontend unthrottled. The default
# case maps to the EMPTY string, not a literal value -- nginx only exempts a
# request from limit_req when its key evaluates to "". A non-empty constant
# (e.g. "0") is still a real key that every non-bot visitor would share one
# global bucket under, which is what happened in #1127: nginx doesn't skip
# rate limiting for a fixed key, it rate-limits *all* requests carrying it
# together. Never replace '' below with a non-empty placeholder (#1090,
# #1125, #1127).
map $http_user_agent $bot_limit_key {
    default                 "";
    "~*GPTBot"               1;
    "~*Amazonbot"            1;
    "~*Bytespider"           1;
    "~*PerplexityBot"        1;
    "~*meta-externalagent"   1;
}
limit_req_zone $bot_limit_key zone=bot_slow:1m rate=2r/m;

# ActivityPub inbox guard: legitimate senders always include an HTTP Signature.
# Used by location = /inbox to reject unsigned POSTs before they hit Go.
map $http_signature $has_ap_signature {
    default 1;   # header present → allow
    ""      0;   # header absent  → reject
}

# log_format dansal_main / feed_anon and the gzip directives are defined once
# in deploy/nginx/dansal-log-formats.conf, installed ahead of this file (see
# #1117, #1132) -- do NOT redeclare them here. Both are global to the whole
# http{} context, and since every dansal-<instance>.conf is loaded together
# into the same nginx process via conf.d/*.conf, a second declaration in any
# instance's file is a fatal "directive is duplicate" error at `nginx -t`
# time for whichever instance is deployed second.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name events.example.com;
    access_log /var/log/nginx/events.example.com.access.log dansal_main;
    error_log  /var/log/nginx/events.example.com.error.log;
    return 301 https://$host$request_uri;
}

# HTTP/3 (QUIC) server
server {
    listen 443 quic;
    listen [::]:443 quic;
    server_name events.example.com;
    server_tokens off;
    access_log /var/log/nginx/events.example.com.access.log dansal_main;
    error_log  /var/log/nginx/events.example.com.error.log;

    ssl_certificate     /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.3;  # HTTP/3 requires TLSv1.3
    ssl_prefer_server_ciphers off;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Connection/request timeouts (mitigate slow-loris-style attacks)
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # HTTP/3 specific settings
    quic_retry on;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # Security headers
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header X-Frame-Options            SAMEORIGIN                            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy         "geolocation=(self), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                         always;

    # Internal-only endpoint: loopback guard is bypassed when behind a proxy.
    # Block at nginx so it never reaches the application. Return 404 (not 403)
    # so the response matches the app's response for unknown routes.
    location = /api/v1/cert-login {
        return 404;
    }

    # Internal-only: dansal-web is the only legitimate caller for the whole
    # /api/v1/register* family (registration, status, resend, verify,
    # passkey begin/finish) -- always over loopback. Block at nginx so a
    # public POST/GET can never bypass dansal-web's honeypot + minimum-
    # fill-time checks. ^~ gives this priority over the /api/v1/(login|
    # register|verify|invites) regex rate-limit location below.
    location ^~ /api/v1/register {
        return 404;
    }

    # Internal-only: dansal-web's anonymous "suggest an event" form runs a
    # full anti-abuse pipeline (IP+UA throttle, honeypot + minimum-fill-time
    # form guard, pending-submission dedup, Turnstile captcha) before ever
    # calling the API -- none of which the API's own suggestHandler/
    # suggestPreviewHandler replicate. Block at nginx so a direct POST can't
    # bypass all of it, same reasoning as /api/v1/register above (see
    # #1120). An authenticated org/publisher (e.g. wp-dansal) uses
    # /api/v1/events instead, which is unaffected.
    location = /api/v1/events/suggest {
        return 404;
    }
    location = /api/v1/events/suggest-preview {
        return 404;
    }

    # dansal-web endpoint that happens to live under /api/ — exact match always
    # wins over the /api/ prefix block below, so it reaches the web frontend
    # instead of the REST API (see #650).
    location = /api/events-more {
        limit_conn conn_limit 20;

        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # REST API — proxied by path prefix
    location /api/ {
        # Apply rate limiting: 10 requests/second with burst of 20
        limit_req zone=api_limit burst=20 nodelay;
        # Cap concurrent connections per IP
        limit_conn conn_limit 20;

        proxy_pass         http://dansal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Strip any client-supplied X-Dansal-Internal so internet clients can
        # never satisfy dansal's internal rate-limit exemption (see #547).
        proxy_set_header   X-Dansal-Internal "";
        client_max_body_size 10m;

        # Return 429 status code instead of default 503 when rate limited
        limit_req_status 429;
    }

    # Special rate limiting for auth endpoints
    location ~* /api/v1/(login|register|verify|invites) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 20;

        proxy_pass         http://dansal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Dansal-Internal "";
        client_max_body_size 10m;
    }

    # iCal/RSS/JSON feed subscriptions. Logged separately, without the client
    # IP, purely to gauge polling frequency (see #650/#651) -- not for
    # per-visitor tracking.
    location ^~ /feed/ {
        limit_conn conn_limit 20;
        access_log /var/log/nginx/events.example.com-feed.log feed_anon;

        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # ActivityPub shared inbox: reject unsigned POSTs before they reach Go.
    # All legitimate ActivityPub senders include an HTTP Signature header.
    # Unsigned POSTs are spam/scanners with no valid key to sign with anyway.
    location = /inbox {
        limit_conn conn_limit 20;
        set $inbox_reject 0;
        if ($request_method = POST) { set $inbox_reject 1; }
        if ($has_ap_signature)      { set $inbox_reject 0; }
        if ($inbox_reject)          { return 401; }

        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Web frontend — everything else (HTML pages + ActivityPub endpoints)
    location / {
        limit_conn conn_limit 20;
        limit_req zone=bot_slow burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://dansal_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

# HTTP/2 + HTTP/1.1 fallback server
