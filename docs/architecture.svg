<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10263f"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a1"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8701e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="790" fill="#fbfbfa"/>

  <!-- ===== External actors ===== -->
  <rect x="90" y="20" width="300" height="55" rx="8" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="240" y="53" text-anchor="middle" font-size="16" fill="#4b5563">Visitors / Browsers</text>

  <rect x="810" y="20" width="300" height="55" rx="8" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="960" y="53" text-anchor="middle" font-size="16" fill="#4b5563">Fediverse (Mastodon, …)</text>

  <line x1="240" y1="75" x2="240" y2="112" stroke="#8a94a1" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="960" y1="75" x2="960" y2="112" stroke="#8a94a1" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ===== nginx ===== -->
  <rect x="90" y="115" width="1020" height="58" rx="8" fill="#dce8f5" stroke="#2f6690" stroke-width="1.5"/>
  <text x="600" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#173754">nginx</text>
  <text x="600" y="160" text-anchor="middle" font-size="12.5" fill="#3a5f7c">reverse proxy + TLS termination — proxies to 127.0.0.1-only services</text>

  <line x1="240" y1="173" x2="240" y2="207" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="600" y1="173" x2="600" y2="207" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="960" y1="173" x2="960" y2="207" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <!-- ===== Services row ===== -->
  <rect x="90" y="210" width="300" height="95" rx="8" fill="#ffffff" stroke="#10263f" stroke-width="2"/>
  <text x="240" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#10263f">dansal-web</text>
  <text x="240" y="259" text-anchor="middle" font-size="12.5" fill="#3a4552">:8080 · web frontend</text>
  <text x="240" y="275" text-anchor="middle" font-size="12.5" fill="#3a4552">+ ActivityPub</text>
  <text x="240" y="295" text-anchor="middle" font-size="11" fill="#6b7684">REST client of dansal</text>

  <rect x="450" y="210" width="300" height="95" rx="8" fill="#ffffff" stroke="#10263f" stroke-width="2"/>
  <text x="600" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#10263f">dansal-webmin</text>
  <text x="600" y="259" text-anchor="middle" font-size="12.5" fill="#3a4552">:8090 · admin web UI</text>
  <text x="600" y="279" text-anchor="middle" font-size="11" fill="#6b7684">REST + Unix socket to dansal;</text>
  <text x="600" y="294" text-anchor="middle" font-size="11" fill="#6b7684">direct SQLite access to web.db</text>

  <rect x="810" y="210" width="300" height="95" rx="8" fill="#ffffff" stroke="#10263f" stroke-width="2"/>
  <text x="960" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#10263f">dansal-doc</text>
  <text x="960" y="259" text-anchor="middle" font-size="12.5" fill="#3a4552">:8070 · docs server</text>
  <text x="960" y="279" text-anchor="middle" font-size="11" fill="#6b7684">standalone — serves wiki/</text>
  <text x="960" y="294" text-anchor="middle" font-size="11" fill="#6b7684">no connection to dansal</text>

  <!-- dansal-web -> web.db -->
  <line x1="240" y1="305" x2="240" y2="333" stroke="#a8701e" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>
  <rect x="150" y="336" width="180" height="52" rx="8" fill="#fbeed9" stroke="#c8873a" stroke-width="1.5"/>
  <text x="240" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4e14">web.db</text>
  <text x="240" y="374" text-anchor="middle" font-size="10.5" fill="#8a5f22">ActivityPub state, site settings</text>

  <!-- dansal-webmin -> web.db (direct sqlite, bypasses API) -->
  <path d="M 470,305 C 380,410 300,420 245,388" fill="none" stroke="#a8701e" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>

  <!-- dansal-doc -> wiki/ -->
  <line x1="960" y1="305" x2="960" y2="333" stroke="#a8701e" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>
  <rect x="870" y="336" width="180" height="52" rx="8" fill="#fbeed9" stroke="#c8873a" stroke-width="1.5"/>
  <text x="960" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4e14">wiki/</text>
  <text x="960" y="374" text-anchor="middle" font-size="10.5" fill="#8a5f22">static help content</text>

  <!-- ===== dansal core ===== -->
  <line x1="240" y1="305" x2="360" y2="428" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="600" y1="305" x2="600" y2="428" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="640" y1="308" x2="620" y2="428" stroke="#10263f" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowNavy)"/>

  <rect x="300" y="430" width="600" height="105" rx="10" fill="#10263f" stroke="#c8873a" stroke-width="2.5"/>
  <text x="600" y="465" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">dansal — REST API</text>
  <text x="600" y="486" text-anchor="middle" font-size="13" fill="#cfd9e6">:8000 · the only component with real data (source of truth)</text>
  <text x="600" y="505" text-anchor="middle" font-size="11.5" fill="#a9bcd2">privileged Unix admin socket · calendar.db · uploaded images</text>
  <text x="600" y="521" text-anchor="middle" font-size="11.5" fill="#a9bcd2">fetches external feeds on a schedule</text>

  <!-- ===== dansal_admin CLI ===== -->
  <rect x="55" y="450" width="190" height="65" rx="8" fill="#ffffff" stroke="#10263f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="150" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#10263f">dansal_admin</text>
  <text x="150" y="493" text-anchor="middle" font-size="11" fill="#3a4552">CLI · scripting</text>
  <line x1="245" y1="482" x2="296" y2="482" stroke="#10263f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowNavy)"/>
  <text x="270" y="470" text-anchor="middle" font-size="9.5" fill="#6b7684">Unix</text>
  <text x="270" y="480" text-anchor="middle" font-size="9.5" fill="#6b7684">socket</text>

  <!-- ===== External feeds ===== -->
  <rect x="960" y="450" width="190" height="65" rx="8" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1055" y="475" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4b5563">External feeds</text>
  <text x="1055" y="493" text-anchor="middle" font-size="11" fill="#5b6673">iCal / JSON</text>
  <line x1="900" y1="475" x2="954" y2="475" stroke="#8a94a1" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="927" y="465" text-anchor="middle" font-size="9.5" fill="#6b7684">scheduled</text>
  <text x="927" y="500" text-anchor="middle" font-size="9.5" fill="#6b7684">fetch</text>

  <!-- ===== Data stores ===== -->
  <line x1="460" y1="535" x2="460" y2="608" stroke="#a8701e" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>
  <line x1="740" y1="535" x2="740" y2="608" stroke="#a8701e" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>

  <rect x="350" y="610" width="220" height="60" rx="8" fill="#fbeed9" stroke="#c8873a" stroke-width="1.5"/>
  <text x="460" y="636" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4e14">calendar.db</text>
  <text x="460" y="655" text-anchor="middle" font-size="11" fill="#8a5f22">events, locations, orgs, users</text>

  <rect x="630" y="610" width="220" height="60" rx="8" fill="#fbeed9" stroke="#c8873a" stroke-width="1.5"/>
  <text x="740" y="636" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4e14">images/</text>
  <text x="740" y="655" text-anchor="middle" font-size="11" fill="#8a5f22">event, org, musician uploads</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(90,715)">
    <rect x="0" y="0" width="1020" height="65" rx="8" fill="none" stroke="#d8dde3" stroke-width="1"/>
    <text x="16" y="22" font-size="12" font-weight="bold" fill="#3a4552">Legend</text>

    <line x1="16" y1="42" x2="56" y2="42" stroke="#10263f" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <text x="64" y="46" font-size="11.5" fill="#3a4552">HTTP / REST API</text>

    <line x1="220" y1="42" x2="260" y2="42" stroke="#10263f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowNavy)"/>
    <text x="268" y="46" font-size="11.5" fill="#3a4552">Unix socket (privileged)</text>

    <line x1="470" y1="42" x2="510" y2="42" stroke="#a8701e" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowGold)"/>
    <text x="518" y="46" font-size="11.5" fill="#3a4552">direct SQLite / file access</text>

    <line x1="740" y1="42" x2="780" y2="42" stroke="#8a94a1" stroke-width="2" marker-end="url(#arrowGray)"/>
    <text x="788" y="46" font-size="11.5" fill="#3a4552">external HTTP traffic</text>
  </g>
</svg>
