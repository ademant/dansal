# dansal-webmin configuration
# Install to /etc/dansal/webmin.yaml
# Protect this file: chmod 640, chown root:dansal

# Address and port the webmin panel listens on (loopback only).
# nginx with ssl_verify_client on terminates TLS and enforces mTLS.
listen: "127.0.0.1:8090"

# Internal URL of the dansal REST API (used for admin authentication).
dansal_url: "http://127.0.0.1:8000"

# Path to the dansal admin socket (must match admin_socket in config.yaml).
admin_socket: "/var/lib/dansal/dansal.sock"

# Path to the dansal-web SQLite database (web.db), used for site-config editing.
web_db_path: "/var/lib/dansal-web/web.db"

# Systemd instance name (e.g. dev, prod). Used to resolve monitored unit names
# like dansal@prod, dansal-fetch@prod.timer, etc. in the dashboard.
instance: ""

# Display name shown in the navigation header.
site_name: "Dansal Webmin"

# Public subdomain for dansal-webmin (used by deploy-nginx-webmin).
# Example: webmin.example.com
# webmin_domain: "webmin.example.com"

# When true, disables password login entirely — only a verified mTLS client
# certificate (via nginx's X-Client-Verified/X-Client-DN headers) can sign
# in. Recommended for the strongest admin-console posture. Can also be set
# via the DANSAL_WEBMIN_CERT_ONLY env var.
# cert_only: false
